# Railway собирает репозиторий из корня, а сайт лежит в подпапке landing.
# Эти настройки позволяют не указывать Root Directory в интерфейсе.
#
# Зависимостей у сайта нет, поэтому установка пропускается: в корневом
# package.json лежат пакеты другого проекта, и ставить их незачем.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["echo 'зависимостей нет'"]

[phases.build]
cmds = ["echo 'сборка не требуется'"]

[start]
cmd = "node landing/server.js"
