<title>HSK Путь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: учебный стол на рисовой бумаге — оглавление слева, одна рабочая колонка; яркие только цвета тонов и красная печать */
:root{
  --bg:#ECEFE8; --surface:#F7F8F4; --surface2:#E3E8E0; --ink:#1A1F1C; --muted:#5B655E; --line:#CFD6CB;
  --accent:#1D6A5A; --accent-ink:#FFFFFF; --accent-soft:#D3E5DE;
  --seal:#B3352A; --seal-ink:#FBF3EE;
  --t1:#C0392B; --t2:#B97A12; --t3:#2E8540; --t4:#2C5CB3; --t5:#858C87;
  --good:#2E8540; --good-soft:#DCEEDF; --bad:#C0392B; --bad-soft:#F6DEDA;
  --f-hz:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-py:"Noto Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191E1B; --surface2:#222925; --ink:#E5EAE3; --muted:#97A29A; --line:#2D3631;
  --accent:#4DB39C; --accent-ink:#0D1A16; --accent-soft:#1C3530;
  --seal:#C4483B; --seal-ink:#FFF4EF;
  --t1:#F0695A; --t2:#E1A93F; --t3:#5FC072; --t4:#6E9BF0; --t5:#8E9790;
  --good:#5FC072; --good-soft:#1C3324; --bad:#F0695A; --bad-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191E1B; --surface2:#222925; --ink:#E5EAE3; --muted:#97A29A; --line:#2D3631;
  --accent:#4DB39C; --accent-ink:#0D1A16; --accent-soft:#1C3530;
  --seal:#C4483B; --seal-ink:#FFF4EF;
  --t1:#F0695A; --t2:#E1A93F; --t3:#5FC072; --t4:#6E9BF0; --t5:#8E9790;
  --good:#5FC072; --good-soft:#1C3324; --bad:#F0695A; --bad-soft:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui)}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(24px,3.4vw,32px);line-height:1.15}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.hz{font-family:var(--f-hz)}
.py{font-family:var(--f-py)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.seal{width:40px;height:40px;flex:none;background:var(--seal);color:var(--seal-ink);font:900 24px/1 var(--f-hz);display:grid;place-items:center;border-radius:5px}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;text-align:left;width:100%}
nav button .g{font:600 18px/1 var(--f-hz);width:22px;text-align:center}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav button[aria-current="page"] .g{color:var(--seal)}
.side .legend{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.side .legend span{display:flex;gap:8px;align-items:center}
.side .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
main{padding-block:28px 96px;padding-inline:clamp(16px,4vw,48px);width:100%;max-width:980px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:14px}
.ph{display:flex;flex-direction:column;gap:6px}
.ph p.lead{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;flex:none}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play svg{width:16px;height:16px}
.banner{border:1px solid var(--t2);background:var(--surface);color:var(--ink);padding:12px 14px;border-radius:10px;font-size:13px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.hero-main{display:flex;flex-direction:column;gap:12px}
.hero-hz{font:600 clamp(40px,7vw,64px)/1.1 var(--f-hz);display:flex;gap:.35em;flex-wrap:wrap}
.hero-side{display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.bignum{font:600 44px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.m{background:var(--t3)}
.lvrow{display:grid;grid-template-columns:70px minmax(0,1fr) 110px;gap:14px;align-items:center;font-size:13px}
.lvrow b{font-size:14px}
.lvrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.check{display:flex;flex-direction:column}
.check label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check em{font-style:normal;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.check label.done span{color:var(--muted);text-decoration:line-through}
/* path */
.level{display:flex;flex-direction:column;gap:14px;padding-block:22px;border-top:1px solid var(--line)}
.level:first-of-type{border-top:0;padding-top:0}
.lvhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.lvbadge{font:600 13px var(--f-ui);border:1.5px solid var(--seal);color:var(--seal);border-radius:6px;padding:8px 10px;text-align:center;min-width:72px}
.lvbadge b{display:block;font:900 30px/1 var(--f-ui);letter-spacing:-.02em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 18px;font-size:13px}
.meta dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.meta dd{margin:0;font-variant-numeric:tabular-nums}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.lbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.lbtn small{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.lbtn span{font:500 18px/1.3 var(--f-hz);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtn.done{background:var(--accent-soft);border-color:transparent}
.lbtn.done small{color:var(--accent)}
.lbtn.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lbtn[disabled]{opacity:.45;cursor:not-allowed}
textarea,input[type=text],input[type=search],select{width:100%;font:14px/1.5 var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:120px;font-family:var(--f-py)}
/* lesson / quiz */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps span.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 20px}
.big{font:600 clamp(64px,15vw,120px)/1.1 var(--f-hz)}
.mid{font:600 clamp(36px,8vw,56px)/1.15 var(--f-hz)}
.pybig{font:500 22px var(--f-py)}
.ru{font-size:18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer;font-size:16px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.opt kbd{font:600 11px var(--f-ui);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.opt .hz{font-size:26px}
.feedback{font-weight:600}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.progress{display:flex;align-items:center;gap:12px;width:100%}
.progress .bar{flex:1}
.progress span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:560px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:600;font-size:14px}
.grades button small{font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grades button:nth-child(1){color:var(--bad)}
.grades button:nth-child(4){color:var(--good)}
.grades button:hover{border-color:var(--muted)}
/* builder */
.build{display:flex;flex-direction:column;gap:12px;width:100%;max-width:620px}
.slot{min-height:58px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tok{font:500 22px/1 var(--f-hz);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tok:hover{border-color:var(--accent)}
.tok.used{visibility:hidden}
/* grammar */
.gtabs{display:flex;gap:6px;flex-wrap:wrap}
.gtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.gtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gram{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding-block:18px;border-top:1px solid var(--line)}
.gram .no{font:600 13px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.gram .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.formula{font:500 14px var(--f-py);background:var(--surface2);border-radius:7px;padding:6px 10px;align-self:flex-start;max-width:100%}
.ex{display:flex;gap:12px;align-items:center}
.ex .hz{font-size:24px}
/* tones */
.tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tone{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.tone:hover{border-color:var(--muted)}
.tone svg{width:72px;height:44px}
.tone b{font-size:15px}
.tone small{color:var(--muted);font-size:12px}
.chao line{stroke:var(--line)}
.chao text{fill:var(--muted);font:9px var(--f-ui)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
/* writing */
.wrap-w{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:720px){.wrap-w{grid-template-columns:1fr}}
#pad{width:100%;aspect-ratio:1/1;max-width:340px;border:2px solid var(--seal);border-radius:4px;background:var(--surface);touch-action:none;cursor:crosshair;display:block}
.rads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rad{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.rad .hz{font-size:28px;text-align:center;color:var(--seal)}
.rad small{display:block;color:var(--muted);font-size:12px}
.strokes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.strokes div{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px}
.strokes .hz{font-size:30px}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.hz{font-size:22px;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.learn{border-color:var(--t2);color:var(--t2)}
.chip.know{border-color:var(--good);color:var(--good)}
.prose{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.prose ol,.prose ul{margin:0;padding-left:20px;display:grid;gap:8px}
.mech{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mech>div{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mech b{font-size:15px}
.mech p{font-size:14px;color:var(--muted)}
.side{overflow-y:auto}
section.row{flex-direction:row}
@media(max-width:860px){.app{grid-template-rows:auto 1fr;align-content:start}}
.pall{font:500 14px var(--f-ui);color:var(--muted);letter-spacing:.02em}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.cchip{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.cchip .hz{font-size:28px;line-height:1.15}.cchip small{font-size:11px;color:var(--muted);font-family:var(--f-py)}
.cchip.known{background:var(--good-soft);border-color:var(--good)}
.cchip.learn{border-color:var(--t2);box-shadow:inset 0 -3px 0 var(--t2)}
.cchip.locked{opacity:.4}
.cchip:hover{border-color:var(--accent)}
.plan{display:flex;flex-direction:column;padding:6px 20px}
.pl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}.pl small{display:block;color:var(--muted);font-size:12px}
.pm{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--accent-ink)}
.pl.done .pm{background:var(--accent);border-color:var(--accent)}.pl.done b{color:var(--muted);text-decoration:line-through}
.grow{display:flex;flex-direction:column;gap:8px}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.gform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.gform input{width:100%;font:14px var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.nzh{display:flex;flex-direction:column;line-height:1.15}.nzh .hz{font-size:15px;color:var(--ink)}.nzh small{font-size:10px;color:var(--muted);font-family:var(--f-py)}
@media(max-width:860px){.nzh{align-items:center}}
.acct{font-size:13px}.acct.sync{color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:10px}.tcard.ok{border-color:var(--good)}
.tbars{display:flex;gap:3px;align-items:flex-end;height:40px}.tbars i{flex:1;max-width:14px;background:var(--surface2);border-radius:2px}.tbars i.ok{background:var(--good)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(60vh,560px);overflow-y:auto;padding:4px}
.msg{max-width:min(88%,560px);padding:10px 14px;border-radius:14px;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.zhm{font-size:22px;line-height:1.4}
.msg details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px;width:98px}.spark i{flex:1;background:var(--accent);border-radius:1px;opacity:.85;min-height:2px}
#xpop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 14px;border-radius:20px;z-index:21;font-size:14px;pointer-events:none}
#xpop.pop{animation:xp 1.1s ease-out forwards}
@keyframes xp{0%{transform:translateY(8px) scale(.9);opacity:0}15%{transform:none;opacity:1}75%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){#xpop.pop{animation:none}}
.xpwin{font:700 22px var(--f-ui);color:var(--accent)}
.chip.combo{border-color:var(--seal);color:var(--seal);font-weight:600}
.gbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:760px){.gbar{grid-template-columns:1fr}}
.gb{display:flex;gap:14px;align-items:center;padding:16px}

const TM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function sylTone(s){s=s.toLowerCase();for(const k in TM){const m=[...TM[k]];for(let i=0;i<4;i++)if(s.includes(m[i]))return i+1}return 5}
function sylBase(s){let r=s;for(const k in TM)[...TM[k]].forEach((ch,i)=>{r=r.split(ch).join(k);r=r.split(ch.toUpperCase()).join(k.toUpperCase())});return r}
function markSyl(base,t){if(!t||t===5)return base;const l=base.toLowerCase();let i=-1;
  if(l.includes('a'))i=l.indexOf('a');else if(l.includes('e'))i=l.indexOf('e');else if(l.includes('ou'))i=l.indexOf('o');
  else{for(let k=l.length-1;k>=0;k--)if('aeiouü'.includes(l[k])){i=k;break}}
  if(i<0)return base;const v=l[i];let ch=[...TM[v]][t-1];if(base[i]!==l[i])ch=ch.toUpperCase();return base.slice(0,i)+ch+base.slice(i+1)}
function numPy(str){return str.trim().split(/\s+/).map(tok=>{const m=tok.match(/^([a-zA-Züv:]+)([0-5])$/);if(!m)return tok;const b=m[1].replace(/u:|v/g,'ü');return markSyl(b,+m[2]||5)}).join(' ')}

function pyParts(py){const p=py.split(/\s+/).filter(Boolean);const out=[];p.forEach((s,i)=>{if(s==='…'){out.push({s:' … ',t:5});return}let pre='';if(i>0&&p[i-1]!=='…'&&/^[aeoāáǎàēéěèōóǒò]/i.test(s))pre="'";out.push({s:pre+s,t:sylTone(s)})});return out}

const PI={b:'б',p:'п',m:'м',f:'ф',d:'д',t:'т',n:'н',l:'л',g:'г',k:'к',h:'х',j:'цз',q:'ц',x:'с',zh:'чж',ch:'ч',sh:'ш',r:'ж',z:'цз',c:'ц',s:'с'};

const PZ={a:'а',ai:'ай',an:'ань',ang:'ан',ao:'ао',e:'э',ei:'эй',en:'энь',eng:'эн',er:'эр',o:'о',ou:'оу',yi:'и',ya:'я',ye:'е',yao:'яо',you:'ю',yan:'янь',yin:'инь',yang:'ян',ying:'ин',yong:'юн',yu:'юй',yue:'юэ',yuan:'юань',yun:'юнь',wu:'у',wa:'ва',wo:'во',wai:'вай',wei:'вэй',wan:'вань',wen:'вэнь',wang:'ван',weng:'вэн',r:'р'};
const INIS=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];
function pallSyl(s){const b=sylBase(String(s)).toLowerCase().replace(/v/g,'ü').replace(/[^a-zü]/g,'');if(!b)return'';if(PZ[b])return PZ[b];
  const ini=INIS.find(i=>b.startsWith(i));if(!ini)return b;let f=b.slice(ini.length);
  if('jqx'.includes(ini)&&f[0]==='u')f='ü'+f.slice(1);if((ini==='n'||ini==='l')&&f==='ue')f='üe';
  if(f==='i'&&['zh','ch','sh','r'].includes(ini))return PI[ini]+'и';if(f==='i'&&['z','c','s'].includes(ini))return PI[ini]+'ы';
  return PF[f]?PI[ini]+PF[f]:b}
const pallOn=()=>S.settings.pall!==false;
function pallW(w){if(!pallOn()||!w||w.sent)return'';const p=String(w.py||'');
  if(w.ph)return p.split(/\s+/).filter(Boolean).map(wd=>wd.split('-').map(pallSyl).join('')).join(' ');
  return p.split(/[\s-]+/).filter(x=>x&&x!=='…').map(pallSyl).join('')}

const RULES=[`<b>ü после j, q, x, y</b> пишется без точек: 去 <span class="py">qù</span>, 鱼 <span class="py">yú</span>. Звучит всё равно ü.`,
`<b>i в начале слога</b> пишется через y: i → yi, ia → ya, ie → ye, in → yin, ing → ying.`,
`<b>u в начале слога</b> пишется через w: u → wu, uo → wo, uan → wan.`,
`<b>ü в начале слога</b> пишется как yu: yu, yue, yuan, yun.`,
`<b>Сокращения после согласной:</b> iou → iu (六 <span class="py">liù</span>), uei → ui (对 <span class="py">duì</span>), uen → un (春 <span class="py">chūn</span>).`,
`<b>Знак тона</b> ставится на a или e, если они есть. В ou — на o. В остальных случаях — на последнюю гласную: <span class="py">liù, duì</span>.`,
`<b>Апостроф</b> разделяет слоги, если второй начинается с a, o, e: 西安 <span class="py">Xī'ān</span> — два слога, 先 <span class="py">xiān</span> — один.`,
`<b>Лёгкий тон</b> пишется без знака: 妈妈 <span class="py">māma</span>. <b>儿</b> в конце слова — просто r: 哪儿 <span class="py">nǎr</span>.`,
`<b>zhi, chi, shi, ri, zi, ci, si</b>: i здесь не «и», а продолжение согласного. 是 <span class="py">shì</span> звучит ближе к «шъ».`];

function sched(c0,q){const c=Object.assign({ef:2.5,iv:0,reps:0,lapses:0},c0||{}),now=Date.now();
  if(q===0){c.lapses++;c.reps=0;c.iv=0;c.ef=Math.max(1.3,c.ef-.2);c.due=now+6e5;return c}
  let iv;if(c.reps===0)iv=[0,1,1,4][q];else if(c.reps===1)iv=[0,2,3,7][q];else iv=c.iv*[0,1.2,c.ef,c.ef*1.3][q];
  iv=Math.max(1,Math.round(iv));if(c.reps>=1&&q>=2)iv=Math.max(iv,c.iv+1);
  c.iv=iv;c.ef=Math.max(1.3,c.ef+[0,-.15,0,.15][q]);c.reps++;c.due=now+iv*DAY;return c}

function doneHTML(){if(L.kind==='test'){const ok=L.pct>=80,nl=L.lvl+1;return`<div class="card stage"><div class="mid">${ok?'过':'考'}</div><h2>${ok?`Тест HSK ${L.lvl} сдан`:'Пока не сдан'}</h2><p class="xpwin">${L.pct}%</p>

  if(L.kind==='rules')return`<div class="card prose" style="max-width:none"><p class="eyebrow">Алфавита в китайском нет. Пиньинь — латинская запись звуков, и эти правила позволяют прочитать любой слог</p><ol>${RULES.map(r=>`<li>${r}</li>`).join('')}</ol>${nx}</div>`;
  return`<div class="card" style="display:flex;flex-direction:column;gap:14px"><p class="eyebrow">Нажми на каждый звук, послушай пример и повтори вслух 3 раза</p><div class="sgrid">${L.items.map(([sym,hz,py,hint])=>`<button class="sbtn" data-a="say" data-t="${hz}"><b class="py">${esc(sym)}</b><span><span class="hz t${sylTone(py)}">${hz}</span> <span class="py t${sylTone(py)}">${py}</span></span><small>${esc(hint)}</small></button>`).join('')}</div>${L.note?`<p class="muted">${esc(L.note)}</p>`:''}${nx}</div>`}
function wordParts(w){const cs=charsOf(w);if(cs.length<2||cs.length>4||!aligned(w))return'';const s=syls(w);return`<div class="row" style="justify-content:center;gap:14px">${cs.map((c,i)=>`<span style="display:flex;flex-direction:column;align-items:center"><span class="hz t${sylTone(s[i])}" style="font-size:26px">${esc(c)}</span><span class="py muted" style="font-size:12px">${esc(s[i])}</span></span>`).join('')}</div>`}

function mountPad(ch){const c=$('#pad');if(!c)return;const dpr=window.devicePixelRatio||1;const size=c.clientWidth||300;c.width=size*dpr;c.height=size*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();let strokes=[],cur=null;
  function draw(){x.clearRect(0,0,size,size);x.strokeStyle=css('--line');x.lineWidth=1;x.setLineDash([5,5]);x.beginPath();x.moveTo(size/2,0);x.lineTo(size/2,size);x.moveTo(0,size/2);x.lineTo(size,size/2);x.moveTo(0,0);x.lineTo(size,size);x.moveTo(size,0);x.lineTo(0,size);x.stroke();x.setLineDash([]);
    if(W.ghost&&ch){x.fillStyle=css('--line');x.font=`400 ${size*.78}px "PingFang SC","Noto Sans SC",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(ch.c,size/2,size/2+size*.03)}
    x.strokeStyle=css('--ink');x.fillStyle=css('--ink');x.lineCap='round';x.lineJoin='round';
    strokes.forEach(s=>{if(s.length===1){x.beginPath();x.arc(s[0][0],s[0][1],s[0][2]/2,0,7);x.fill();return}
      for(let i=1;i<s.length;i++){x.beginPath();x.lineWidth=(s[i-1][2]+s[i][2])/2;x.moveTo(s[i-1][0],s[i-1][1]);x.lineTo(s[i][0],s[i][1]);x.stroke()}})}
  const base=()=>W.tool==='brush'?size/13:Math.max(5,size/34);
  const pt=(e,w)=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,w]};
  const isPen=e=>e.pointerType==='pen'&&e.pressure>0;let lt=0;
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);lt=performance.now();const w0=W.tool==='brush'?base()*(isPen(e)?.25+e.pressure:.5):base();cur=[pt(e,w0)];strokes.push(cur);padInk=true;draw()};
  c.onpointermove=e=>{if(!cur)return;const now=performance.now(),p=pt(e,0),q=cur[cur.length-1],d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<1.5)return;
    let w=base();if(W.tool==='brush'){const v=d/Math.max(1,now-lt),tgt=isPen(e)?base()*(.25+e.pressure*1.1):base()*Math.max(.28,1.15-v*.55);w=q[2]*.75+tgt*.25}

  draw();try{document.fonts.load(`40px "Noto Sans SC"`,ch?ch.c:'汉').then(draw)}catch(e){}}

const NOTES={'的':'Частица принадлежности и определения: 我的书 — моя книга. Не путай с 得 (после глагола) и 地 (перед глаголом): все три читаются de.','了':'Отмечает завершённое действие (我吃了) или новую ситуацию (下雨了). Это не «прошедшее время» в русском смысле.','吗':'Превращает утверждение в вопрос да/нет. С вопросительными словами (什么, 谁, 哪儿) не ставится.','呢':'«А как насчёт…?»: 你呢？ Ещё отмечает длящееся действие: 他在吃饭呢.','吧':'Смягчает: предложение (走吧 — пошли), просьба, предположение (是吧 — так ведь?).','是':'Связка между существительными: 我是学生. С прилагательными не ставится: 我很忙, а не 我是忙.','很':'Перед прилагательным часто почти не переводится: 我很好 — у меня всё хорошо. Без него фраза звучит как сравнение.','不':'Отрицание настоящего, будущего и привычки. Перед 4 тоном читается bú: 不是 bú shì.','没':'Отрицание прошлого и глагола 有: 我没去, 没有钱.','二':'二 — в счёте и номерах (第二, 十二). Перед счётным словом говорят 两: 两个人.','两':'«Два» перед счётным словом: 两本书. В счёте и номерах — 二.','个':'Универсальное счётное слово. Если не знаешь нужного, 个 почти всегда поймут.','会':'Выученный навык: 我会说汉语. Также «будет, вероятно»: 明天会下雨.','能':'Возможность по обстоятельствам: 今天我不能去. Навык — это 会.','想':'Хотеть (мягче, чем 要) и думать, скучать: 我想你.','要':'Хотеть твёрдо, нужно, собираться: 我要这个.','在':'Глагол «находиться» (我在家) и предлог места перед глаголом (在学校学习). В 正在 — «в процессе».','有':'Иметь и «есть, имеется»: 桌子上有书. Отрицание только 没有.','去':'Движение от говорящего. 来 — к говорящему.','来':'Движение к говорящему. 去 — от говорящего.','看':'Смотреть, читать (процесс). Результат «увидел» — 看见.','看见':'Увидеть — результат. 看 — сам процесс смотрения.','认识':'Знать лично человека, место или иероглиф. Знать факт — 知道.','知道':'Знать факт, информацию. Знать человека — 认识.','都':'«Все, всё» ставится перед глаголом: 我们都是学生.','也':'«Тоже» ставится перед глаголом: 我也去.','和':'«И» только между существительными: 我和你. Предложения так не соединяют.','几':'Сколько — о небольших числах, обычно со счётным словом: 几个人?','多少':'Сколько — о любом количестве: 多少钱?','怎么':'Как (способ) и почему: 怎么走? 你怎么没来?','怎么样':'Как дела, каково: 你身体怎么样?','谁':'Кто. Читается shéi, в книжной речи — shuí.','哪':'nǎ — какой (вопрос). 那 nà — тот. Различаются только тоном.','那':'nà — тот. 哪 nǎ — какой. Различаются только тоном.','喜欢':'Нравиться — и с существительным, и с глаголом: 喜欢茶, 喜欢喝茶.','块':'Разговорное «юань». На ценниках и в документах — 元.','点':'Час (三点) и «немного» (一点儿).','号':'Число месяца в речи: 五月一号. На письме — 日.','星期':'Неделя. Дни: 星期一 понедельник … 星期六 суббота, воскресенье — 星期天 или 星期日.','得':'После глагола вводит оценку: 说得很好. В разговоре děi — «надо».','过':'Опыт: 我去过中国 — я бывал в Китае.','着':'Длящееся состояние: 门开着 — дверь открыта.','再':'Ещё раз — о будущем: 再说一遍. О прошлом — 又.','还':'Ещё, до сих пор: 他还没来. В счёте денег — «вернуть» huán.','就':'«Сразу, именно», раньше ожидаемого: 他八点就来了.','对':'Правильный (对!) и предлог «к, по отношению к»: 对我来说.','给':'Давать и предлог «для, кому»: 给你打电话.','让':'Позволять, заставлять: 让我想想 — дай подумать.','比':'Сравнение: A 比 B + прилагательное. 很 в такой фразе не ставится.','离':'Расстояние «от»: 我家离这儿很远.','从':'От, из — начало во времени и пространстве: 从八点到十点.','往':'В направлении: 往前走 — идите вперёд.','已经':'Уже, обычно с 了 в конце: 我已经吃了.','正在':'В процессе, часто с 呢 в конце: 我正在吃饭呢.','因为…所以':'Оба союза обычно ставят вместе, в отличие от русского.','虽然…但是':'Оба союза — норма: 虽然很累，但是很快乐.','太':'太…了 — «слишком»: 太贵了.','一点儿':'Немного — после прилагательного или глагола: 便宜一点儿. Перед прилагательным не ставится.','没关系':'Ответ на 对不起. На 谢谢 отвечают 不客气.','不客气':'Ответ на 谢谢. На 对不起 отвечают 没关系.'};
let CHPY=null,CHGR=null,EXPOOL=null,IMEX=null;
function libIndex(){if(CHPY)return;CHPY={};CHGR={};
  WORDS.filter(w=>!w.gr&&!w.sent&&aligned(w)).forEach(w=>{const s=syls(w);charsOf(w).forEach((c,i)=>{if(!CHPY[c]||sylTone(CHPY[c])===5)CHPY[c]=s[i].toLowerCase()})});
  const FORM={};GRAPH.forEach(g=>{FORM[g.g]=g;(g.v||'').split(' ').filter(Boolean).forEach(v=>FORM[v]=g)});
  GRAPH.forEach(g=>g.exs.forEach(e=>{(CHGR[e.hz]=CHGR[e.hz]||new Set()).add(g)}));
  COMPOSE.forEach(c=>c.comps.forEach(p=>{if(FORM[p])(CHGR[c.c]=CHGR[c.c]||new Set()).add(FORM[p])}));
  EXPOOL=[...Object.values(GR).flat().map(g=>({hz:g.ex.replace(/ /g,'')+(g.p??'。'),ru:g.ru})),...DLG.flatMap(d=>d.lines.map(l=>({hz:l[1],ru:l[3]}))),...START_WORDS.map(w=>({hz:w.hz,ru:w.ru}))]}
const COMPM=()=>Object.fromEntries(COMPOSE.map(c=>[c.c,c]));
const PHONM=()=>{const m={};PHON.forEach(f=>f.m.forEach(x=>m[x.hz]=f));return m};
const charMean=c=>CHARM[c]||(WORDS.find(w=>w.lvl>0&&w.hz===c)||WORDS.find(w=>!w.gr&&w.hz===c)||{}).ru||(GRAPH.find(g=>g.g===c)||{}).ru||'';
/* ---------- модель иероглифов ---------- */
let CHARS=[],CHM={};
function buildChars(){CHARS=[];CHM={};libIndex();
  const add=(c,w,lvl,ut)=>{if(!/\p{Script=Han}/u.test(c))return;let it=CHM[c];if(!it){const i=charsOf(w).indexOf(c);const py=CHPY[c]||(aligned(w)?syls(w)[i]:'');it=CHM[c]={c,py,lvl,ut,words:[]};CHARS.push(it)}if(!it.words.includes(w)&&!w.sent)it.words.push(w)};
  [1,2].forEach(l=>UNITS[l]&&UNITS[l].forEach((u,ui)=>u.words.forEach(w=>{if(!w.bonus)charsOf(w).forEach(c=>add(c,w,l,ui))})));
  [3,4,5,6].forEach(l=>byLvl(l).forEach(w=>charsOf(w).forEach(c=>add(c,w,l,999))));
  CHARS.forEach(it=>{it.ru=charMean(it.c)||'—';const id='c:'+it.c;const w={id,hz:it.c,py:it.py,ru:it.ru,lvl:0,chr:true,exs:it.words.slice(0,3).map(x=>x.hz+' '+pyText(x.py)+' — '+x.ru).join(' · ')};it.w=w;WORDS.push(w);WB[id]=w})}
const cStat=it=>{const c=S.srs['c:'+it.c];return c?(c.iv>=7?'known':'learn'):levelOpen(it.lvl)?'new':'locked'};
const unitDone=(l,u)=>!!S.lessons[lkey(l,u)];
function charQueue(){return CHARS.filter(it=>cStat(it)==='new').sort((a,b)=>(unitDone(b.lvl,b.ut)-unitDone(a.lvl,a.ut))||a.lvl-b.lvl||a.ut-b.ut)}
const charsLearned=()=>Object.keys(S.srs).filter(id=>id.startsWith('c:')&&WB[id]).length;
const wordsLearned=()=>Object.keys(S.srs).filter(id=>{const w=WB[id];return w&&w.lvl>0&&!w.chr&&!w.gr&&!w.sent}).length;
const KNOWN=()=>{const s=new Set();Object.keys(S.srs).forEach(id=>{const w=WB[id];if(w&&w.lvl>0&&!w.chr)s.add(w.hz)});return s};
function explainHTML(w){libIndex();const cm=COMPM(),pm=PHONM();
  if(w.gr){const g=GRAPH.find(x=>x.g===w.hz);return g?gcard(g):''}
  const cs=[...new Set(charsOf(w).filter(c=>/\p{Script=Han}/u.test(c)))].slice(0,10);const s=aligned(w)?syls(w):null;
  const parts=cs.map((c,i)=>{const py=s&&!w.sent?s[charsOf(w).indexOf(c)]:CHPY[c]||'';const comp=cm[c],gr=CHGR[c]?[...CHGR[c]]:[],fam=pm[c];
    return`<button class="xpart" data-a="say" data-t="${esc(c)}"><span class="hz t${sylTone(py||'')}">${esc(c)}</span><span><b><span class="py">${esc(py)}</span> · ${esc(charMean(c))}</b>${comp?`<small>${esc(comp.comps.join(' + '))} — ${esc(comp.story)}</small>`:gr.length?`<small>Графемы: ${gr.map(g=>esc(g.g)+' '+esc(g.ru)).join(' · ')}</small>`:''}${fam?`<small>Звуковая часть ${esc(fam.ph)} ${esc(fam.py)}</small>`:''}</span></button>`}).join('');
  const lit=cs.length>1&&cs.length<=4&&!w.sent?`<p class="muted" style="font-size:13px">Дословно: ${cs.map(c=>esc((charMean(c)||'?').split(/[;,(]/)[0].trim())).join(' + ')}</p>`:'';
  const note=NOTES[w.hz];const exs=w.sent?[]:EXPOOL.filter(e=>e.hz!==w.hz&&e.hz.includes(w.hz)).sort((a,b)=>a.hz.length-b.hz.length).slice(0,2);
  return`<article class="xcard"><div class="xhead"><span class="hz xhz">${hzHTML(w)}</span><div style="min-width:0;flex:1"><div class="pybig">${pyW(w)}</div>${pallHTML(w)}<div class="ru">${esc(w.ru)}</div></div>${playBtn(sayT(w))}</div>${lit}
    ${parts?`<div class="xparts">${parts}</div>`:''}${note?`<p class="xnote">${esc(note)}</p>`:''}
    ${exs.length?`<div class="xex"><p class="eyebrow">Пример</p>${exs.map(e=>`<button data-a="say" data-t="${esc(e.hz)}"><span class="hz">${esc(e.hz)}</span><span class="muted">${esc(e.ru)}</span></button>`).join('')}</div>`:''}
    <div class="row" style="justify-content:space-between"><span class="chip">${w.gr?'графема':w.lvl?'HSK '+w.lvl:'фраза'}</span>${S.srs[w.id]?statusChip(w):`<button class="btn ghost sm" data-a="libadd" data-id="${esc(w.id)}">В повторение</button>`}</div></article>`}
const statusChip=w=>{const c=S.srs[w.id];if(c)return(w.chr?c.iv>=7:c.iv>=21)?'<span class="chip know">усвоено</span>':'<span class="chip learn">учу</span>';
  const closed=w.chr?(CHM[w.hz]&&!levelOpen(CHM[w.hz].lvl)):(w.lvl>0&&w.lvl<=6&&!levelOpen(w.lvl));return closed?'<span class="chip" style="opacity:.6">пока рано</span>':'<span class="chip">новое</span>'};
function libList(){const q=D.q.trim().toLowerCase(),qb=sylBase(q).replace(/[\s'-]/g,'');
  return WORDS.filter(w=>{if(D.lvl===-3){if(!S.srs[w.id]||w.chr)return false}else if(D.lvl===-4){if(!w.chr)return false}else if(D.lvl===-2){if(!w.gr)return false}else if(D.lvl===0){if(w.lvl!==0||w.gr||w.chr)return false}else if(D.lvl>0&&w.lvl!==D.lvl)return false;
    return!q||w.hz.includes(D.q.trim())||w.ru.toLowerCase().includes(q)||sylBase(w.py).toLowerCase().replace(/[\s'’,.?!-]/g,'').includes(qb)})}
function libResults(){const list=libList();if(!list.length)return'<p class="muted">Ничего не найдено. Попробуй пиньинь без тонов (xuexi) или слово по-русски.</p>';
  const more=list.length>D.limit?`<div class="row" style="justify-content:center"><button class="btn ghost" data-a="libmore">Показать ещё (${list.length-D.limit})</button></div>`:'';

['sprint','速','Тон-спринт','60 секунд: угадай на слух как можно больше тонов.',()=>`рекорд: ${S.stats.sprintBest}`],
['sent','句','Фразы из твоих слов','Собирай предложения только из слов, которые уже выучил. Больше слов — длиннее и сложнее фразы.',()=>`открыто моделей: ${sentAvail().length} из ${STPL.length}`]];
let GSN={items:[],i:0,ans:null};
function sentInit(){const K=KNOWN(),tr=sentTier(K);const items=genSents(8);GSN={items:items.map((s,i)=>{const it={...s,mode:tr>=2&&i%3===2?'read':'build'};if(it.mode==='read'){const o=shuffle(items.filter(x=>x!==s)).slice(0,2).map(x=>x.ru);it.opts=shuffle([s.ru,...o])}return it}),i:0,ans:null};B=null}
function sentGameHTML(){if(!GSN.items.length)return`<div class="card stage"><div class="mid">句</div><h2>Пока мало выученных слов</h2><p class="muted" style="max-width:46ch">Фразы собираются только из слов, которые ты уже выучил. Пройди первые темы HSK 1 — «Знакомство» и «Вежливость», — и здесь появятся упражнения.</p><button class="btn" data-a="nextlesson">К следующему уроку</button></div>`;
  if(GSN.i>=GSN.items.length)return`<div class="card stage"><div class="mid">句</div><h2>Раунд окончен</h2><p class="muted">Открыто моделей: ${sentAvail().length} из ${STPL.length}. Учи новые слова, чтобы открыть длиннее фразы.</p><div class="row" style="justify-content:center"><button class="btn" data-a="game" data-g="sent">Ещё раунд</button>${gBack}</div></div>`;
  const it=GSN.items[GSN.i],s=it.ex.replace(/ /g,''),prog=gProg(GSN.i,GSN.items.length);
  if(it.mode==='read'){const done=GSN.ans!==null;return`<div class="card stage">${prog}<p class="eyebrow">Что значит эта фраза?</p><div class="sent">${esc(s+it.p)}</div>${playBtn(s)}<p class="py muted">${esc(it.py)}</p>
    <div class="opts" style="grid-template-columns:1fr">${it.opts.map((o,i)=>`<button class="opt ${done?(o===it.ru?'ok':i===GSN.ans?'no':''):''}" data-a="sans" data-i="${i}" ${done?'disabled':''}><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div>${done?'<button class="btn" data-a="snext" id="snext">Дальше</button>':''}</div>`}
  const bh=buildHTML('sent',it);return`<div class="card stage">${prog}<p class="eyebrow">Собери фразу по-китайски</p><p class="ru" style="font-size:20px">${esc(it.ru)}</p>${bh}${B&&B.state==='ok'?`<p class="py muted">${esc(it.py)}</p><button class="btn" data-a="snext" id="snext">Дальше</button>`:''}</div>`}
function composeAvail(){const done=new Set();[1,2].forEach(l=>UNITS[l]&&UNITS[l].forEach((u,i)=>{if(S.lessons[lkey(l,i)])u.words.forEach(w=>charsOf(w).forEach(c=>done.add(c)))}));
  const a=COMPOSE.filter(x=>S.srs['c:'+x.c]||done.has(x.c)).map(x=>({...x,known:true}));if(a.length>=8)return a;
  const rest=COMPOSE.filter(x=>!a.some(y=>y.c===x.c)&&(!CHM[x.c]||levelOpen(CHM[x.c].lvl))).sort((p,q)=>((CHM[p.c]||{lvl:9}).lvl-(CHM[q.c]||{lvl:9}).lvl));return[...a,...rest.slice(0,10-a.length)]}
const gBack='<button class="btn ghost" data-a="gexit">К играм</button>';
views.games=()=>{if(!GM.g)return`<header class="ph"><p class="eyebrow">Игры</p><h1>Тренировка в формате игры</h1><p class="lead">Каждая игра качает свой навык: сборку иероглифов, печать, память и слух. Все дают XP, идут в цель дня и в награды.</p></header>${gameBar()}
  <div class="games">${GAMES.map(([k,ic,t,d,st])=>`<button class="gamec" data-a="game" data-g="${k}"><span class="seal gseal">${ic}</span><div style="min-width:0"><b>${t}</b><p>${d}</p><small>${st()}</small></div></button>`).join('')}</div>`;
  const head=t=>`<header class="ph"><div class="row" style="justify-content:space-between"><p class="eyebrow">Игры · ${t}</p><button class="btn ghost sm" data-a="gexit">К играм</button></div></header>`;
  if(GM.g==='build')return head('Собери иероглиф')+buildGameHTML();
  if(GM.g==='type')return{html:head('Печать')+typeGameHTML(),mount:()=>{const p=$('#pin');if(p&&!(GT.state))try{p.focus({preventScroll:true})}catch(e){}}};
  if(GM.g==='pairs')return head('Пары')+pairsHTML();
  if(GM.g==='sent')return head('Фразы из твоих слов')+sentGameHTML();
  return head('Тон-спринт')+sprintHTML()};
function gProg(i,n){return`<div class="progress"><div class="bar"><i style="width:${i/n*100}%"></i></div><span>${Math.min(i+1,n)} / ${n}</span>${combo>=2?`<span class="chip combo">连对 ×${combo}</span>`:''}</div>`}
function buildGameHTML(){if(GB.i>=GB.items.length)return`<div class="card stage"><div class="mid">合</div><h2>Раунд окончен</h2><p class="muted">Собрано с первой попытки или после ошибок: ${GB.score} из ${GB.items.length}</p><div class="row" style="justify-content:center"><button class="btn" data-a="game" data-g="build">Ещё раунд</button>${gBack}</div></div>`;
  const it=GB.items[GB.i],fin=GB.state==='ok'||GB.state==='show';
  const prompt=`<p class="eyebrow">Собери иероглиф ${it.known?'<span class="chip know">знакомый</span>':'<span class="chip learn">новый</span>'}</p><p class="ru" style="font-size:22px">«${esc(it.ru)}»</p>
    <div class="row" style="justify-content:center;gap:10px">${playBtn(it.c,'Как звучит')}<span class="pybig">${pyHTML(it.py)}</span>${pallHTML(it.py)}</div><p class="muted" style="font-size:13px">Нажми, чтобы услышать. Частей: ${it.comps.length}</p>`;
  if(fin)return`<div class="card stage">${gProg(GB.i,GB.items.length)}${prompt}<div class="big">${esc(it.c)}</div><p class="ru"><span class="hz">${it.comps.map(esc).join(' + ')} = ${esc(it.c)}</span></p><p class="muted" style="max-width:46ch">${esc(it.story)}</p><div class="row" style="justify-content:center">${playBtn(it.c)}<button class="btn" data-a="gbnext" id="gbnext">Дальше</button></div></div>`;
  return`<div class="card stage">${gProg(GB.i,GB.items.length)}${prompt}<div class="build"><div class="slot ${GB.state==='no'?'no':''}">${GB.chosen.length?GB.chosen.map((k,j)=>`<button class="tok" data-a="gbu" data-j="${j}">${esc(GB.tiles[k])}</button>`).join('<span class="muted">+</span>'):'<span class="muted" style="font-size:13px">Нажимай нужные графемы</span>'}</div>
    <div class="pool">${GB.tiles.map((t,k)=>`<button class="tok ${GB.chosen.includes(k)?'used':''}" data-a="gbt" data-k="${k}">${esc(t)}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost sm" data-a="gbr">Сбросить</button><button class="btn ghost sm" data-a="gbshow">Показать ответ</button><button class="btn sm" data-a="gbc" ${GB.chosen.length?'':'disabled'}>Собрать</button></div>${GB.state==='no'?'<p class="feedback no">Не тот набор частей, попробуй ещё</p>':''}</div></div>`}
function typeGameHTML(){if(GT.lesson&&GT.i>=GT.items.length)return`<div class="card stage"><div class="mid">打</div><h2>Печать готова</h2><p class="muted">Верно ${GT.score} из ${GT.items.length}</p><button class="btn" data-a="lnext" id="tnextg">К диалогу</button></div>`;
  const seg=GT.lesson?'<p class="eyebrow">Напечатай слова темы через пиньинь — так печатают в Китае</p>':`<div class="seg" role="group"><button data-a="tmodeg" data-m="train" aria-pressed="${GT.mode==='train'}">Тренировка</button><button data-a="tmodeg" data-m="free" aria-pressed="${GT.mode==='free'}">Свободная печать</button></div>`;
  const ime=`<div class="ime"><input id="tout" class="tout" value="${esc(GT.out)}" aria-label="Текст на китайском" autocomplete="off"><div class="row" style="gap:8px;flex-wrap:nowrap"><input type="text" id="pin" placeholder="пиньинь латиницей: nihao" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(GT.pin)}" aria-label="Пиньинь"><button class="btn ghost sm" data-a="tdel" aria-label="Стереть последний иероглиф">Стереть</button></div><div id="cands" class="cands">${candsHTML()}</div>
    <p class="muted" style="font-size:12px;text-align:left">Цифра или нажатие — выбрать вариант, пробел — первый вариант, Backspace в пустом поле — стереть иероглиф, ü набирай как v. Если на устройстве есть китайская клавиатура, печатай прямо в верхнее поле.</p></div>`;
  if(GT.mode==='free')return`<div class="card" style="display:flex;flex-direction:column;gap:12px">${seg}${ime}<div class="row"><button class="btn ghost sm" data-a="tsay">Озвучить</button><button class="btn ghost sm" data-a="tcopy">Скопировать</button><button class="btn ghost sm" data-a="tclr">Очистить</button></div></div>`;
  if(GT.i>=GT.items.length)return`<div class="card stage">${seg}<div class="mid">打</div><h2>Раунд окончен</h2><p class="muted">Верно ${GT.score} из ${GT.items.length}</p><div class="row" style="justify-content:center"><button class="btn" data-a="game" data-g="type">Ещё раунд</button>${gBack}</div></div>`;
  const w=GT.items[GT.i];
  return`<div class="card stage">${seg}${gProg(GT.i,GT.items.length)}<p class="eyebrow">Напечатай по-китайски</p><div class="ru" style="font-size:22px">${esc(w.ru)}</div>
    <div class="row" style="justify-content:center">${playBtn(w.hz)}${GT.hint||GT.state?`<span class="pybig">${pyW(w)}</span>${pallHTML(w)}`:`<button class="btn ghost sm" data-a="thint">Подсказка: пиньинь</button>`}</div>
    <div style="width:100%;max-width:520px">${ime}</div>
    ${GT.state?`<p class="feedback ${GT.state}">${GT.state==='ok'?'Верно':'Правильно: '+esc(w.hz)}</p><button class="btn" data-a="tnextg" id="tnextg">Дальше</button>`:`<div class="row" style="justify-content:center"><button class="btn" data-a="tcheck">Проверить</button><button class="btn ghost" data-a="tskip">Не знаю</button></div>`}</div>`}
function pairsHTML(){const head=`<div class="row" style="justify-content:space-between"><span class="muted">Ходов: ${GP.moves} · найдено ${GP.done.size} из ${GP.n}</span><button class="btn ghost sm" data-a="game" data-g="pairs">Заново</button></div>`;
  if(GP.end)return`<div class="card stage"><div class="mid">对</div><h2>Все пары найдены</h2><p class="muted">Ходов: ${GP.moves}. Рекорд: ${S.stats.pairsBest}. Идеал — ${GP.n}.</p><div class="row" style="justify-content:center"><button class="btn" data-a="game" data-g="pairs">Ещё раз</button>${gBack}</div></div>`;
  return`<div class="card" style="display:flex;flex-direction:column;gap:12px">${head}<div class="pairs">${GP.cards.map((c,i)=>{const w=WB[c.id],ok=GP.done.has(c.id),up=ok||GP.open.includes(i);
    return`<button class="pcard ${up?'up':''} ${ok?'ok':''}" data-a="pflip" data-i="${i}" ${ok?'disabled':''} aria-label="${up?esc(c.f==='hz'?w.hz:w.ru):'Закрытая карточка'}">${up?(c.f==='hz'?`<span class="hz">${esc(w.hz)}</span>`:`<span>${esc(w.ru)}</span>`):'<span class="hz pback">汉</span>'}</button>`}).join('')}</div></div>`}
function sprintQ(){const q=rnd(QUADS),t=1+Math.floor(Math.random()*4);GS.q={ch:q.c[t-1],b:q.b,t}}
function sprintHTML(){if(GS.state==='idle')return`<div class="card stage"><div class="mid">速</div><h2>60 секунд на тоны</h2><p class="muted" style="max-width:46ch">Слушай слог и выбирай тон. Цифры 1–4 на клавиатуре тоже работают. Ошибка не штрафует, но обнуляет комбо.</p><p>Рекорд: <b>${S.stats.sprintBest}</b></p><button class="btn" data-a="gsstart">Старт</button></div>`;
  if(GS.state==='end')return`<div class="card stage"><div class="mid">${GS.score}</div><h2>${GS.rec?'Новый рекорд!':'Время вышло'}</h2><p class="muted">Верно ${GS.score} из ${GS.total}. Рекорд: ${S.stats.sprintBest}</p><div class="row" style="justify-content:center"><button class="btn" data-a="gsstart">Ещё раз</button>${gBack}</div></div>`;
  const left=Math.max(0,Math.ceil((GS.end-Date.now())/1000));
  return`<div class="card stage"><div class="row" style="justify-content:space-between;width:100%"><span class="bignum" id="gst" style="font-size:34px">${left}</span><span>Счёт: <b>${GS.score}</b>${combo>=2?` <span class="chip combo">连对 ×${combo}</span>`:''}</span></div>
    <button class="play" style="width:80px;height:80px" data-a="say" data-t="${GS.q.ch}" aria-label="Прослушать ещё раз">${PLAY}</button>

    <p class="feedback ${GS.last||''}">${GS.lastMsg||'&nbsp;'}</p></div>`}
function finishSprint(){clearInterval(gsTimer);gsTimer=null;GS.state='end';GS.rec=false;if(GS.score>(S.stats.sprintBest||0)){S.stats.sprintBest=GS.score;GS.rec=true;addXP(10,'Рекорд · +10 XP')}save();if(view==='games')render()}

  <section class="level" style="padding-top:0;border-top:0"><div class="lvhead"><div class="lvbadge">ЗНАКИ<b>${SIGN_UNITS.length}</b></div><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><h2>Курс: 100 графем, звуковые части, похожие знаки</h2>

  <section><h2>100 ключевых графем</h2><p class="muted" style="max-width:68ch">Нажми на графему, чтобы услышать её или пример с ней. Номера — по исходному списку, разбор каждой графемы — в уроках курса.</p>
    ${GCATS.map(c=>`<div style="display:flex;flex-direction:column;gap:8px"><h3>${esc(c)}</h3><div class="gchips">${GRAPH.filter(x=>x.cat===c).map(it=>`<button class="gchip" data-a="say" data-t="${esc(it.w.say)}"><small>${it.n}</small><span class="hz">${esc(it.g)}</span><span class="muted">${esc(it.v)}</span><span class="gru">${esc(it.ru)}</span></button>`).join('')}</div></div>`).join('')}</section>
  <section><h2>Как образуются иероглифы · 六书</h2><div class="mech">${SIX.map(([h,p,t,d,e,pc])=>`<div><div class="row" style="justify-content:space-between"><b><span class="hz">${h}</span> ${t}</b><span class="chip">${pc}</span></div><span class="py muted" style="font-size:13px">${p}</span><p>${d}</p><p class="hz" style="color:var(--ink);font-size:15px">${e}</p></div>`).join('')}</div>
    <p class="muted" style="max-width:68ch">Доли — по классическому анализу иероглифов. Главный вывод: почти любой незнакомый иероглиф — это «смысл + звук», поэтому графемы и звуковые части окупаются на каждом уровне.</p></section>

const sumDays=(f,n=7)=>{let s=0;for(let k=0;k<n;k++){const d=new Date();d.setDate(d.getDate()-k);const r=S.days[dkey(d)];s+=(r&&r[f])||0}return s};
function goalCalc(){const g=S.goal;if(!g)return null;const left=Math.max(1,Math.ceil((new Date(g.until+'T23:59:59')-Date.now())/DAY));
  const wl=wordsLearned(),cl=charsLearned(),pw=sumDays('nw')/7,pc=sumDays('nc')/7,nw=Math.max(0,g.words-wl)/left,nc=Math.max(0,g.chars-cl)/left;
  const fc=(rem,p)=>rem<=0?'готово':p>0?new Date(Date.now()+rem/p*DAY).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'нужен темп';
  return{g,left,wl,cl,pw,pc,nw,nc,fw:fc(g.words-wl,pw),fcs:fc(g.chars-cl,pc),okw:pw>=nw*.9,okc:pc>=nc*.9,lvlOk:levelDone(g.level)}}

const sprDayOf=(()=>{let m=null;return hz=>{if(!m){m={};SPR.forEach(d=>d.ws.forEach(h=>m[h]=d.i))}return m[hz]}})();
const sprOpen=i=>i===0||!!(S.spr&&S.spr.d&&S.spr.d[i-1]&&S.spr.d[i-1].learn);
const sprLearned=d=>d.W.filter(w=>S.srs[w.id]).length;
function sprKeyChars(d){const seen=new Set(),out=[];d.W.forEach(w=>charsOf(w).forEach(c=>{if(seen.has(c)||!CHM[c])return;seen.add(c);const prev=SPR.slice(0,d.i).some(x=>x.W.some(v=>charsOf(v).includes(c)));if(!prev)out.push(CHM[c])}));const fs=c=>sprFam(c).length;return out.map((it,k)=>({it,k,f:fs(it.c)})).sort((a,b)=>b.f-a.f||a.k-b.k).slice(0,12).sort((a,b)=>a.k-b.k).map(x=>x.it)}
function sprFam(c){return WORDS.filter(w=>(w.lvl===1||w.lvl===2)&&!w.bonus&&!w.chr&&w.hz.length>1&&w.hz.includes(c))}
function sprToday(){if(!S.spr||!S.spr.start)return null;const n=Math.floor((new Date(dkey()+'T12:00')-new Date(S.spr.start+'T12:00'))/DAY);return Math.max(0,Math.min(SPR.length-1,n))}

function sprFamHTML(d){const ks=sprKeyChars(d).map(it=>({it,f:sprFam(it.c)})).filter(x=>x.f.length>=2).sort((a,b)=>b.f.length-a.f.length);

function sprDrill(d,mode){if(!SP||SP.d!==d.i||SP.mode!==mode){let pool=mode==='rev'?shuffle(SPR.slice(0,d.i).flatMap(x=>x.S)).slice(0,8):shuffle(d.S);SP={d:d.i,mode,order:pool,i:0,ok:0,miss:0};B=null}

function sprWrite(d){const ks=sprKeyChars(d),left=ks.filter(it=>!S.srs['c:'+it.c]);

function sprDayView(i){const d=SPR[i],tab=V.t||'phr',st=sprStage(i);const tabs=[['phr','Фразы'],['fam','Семьи знаков'],['build','Сборка'],['dict','Диктант'],['write','Письмо'],['rev','Повтор прошлых дней']];

views.sprint=()=>{if(V.d!=null&&SPR[V.d])return sprDayView(V.d);const tot=SPR.reduce((a,d)=>a+d.W.length,0),lr=SPR.reduce((a,d)=>a+sprLearned(d),0),td=sprToday(),nx=sprNextDay();

  <section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><b>Выучено ${lr} из ${tot} слов</b><span class="muted">${S.spr&&S.spr.start?`старт ${new Date(S.spr.start).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} · по плану день ${td+1}`:'спринт не начат'}</span></div><div class="bar"><i style="width:${lr/tot*100}%"></i></div>

function slotItems(s,K){const okz=it=>it.z.every(h=>K.has(h));
  return{P:PRON.filter(p=>K.has(p.hz)),PX:PRON.filter(p=>p.hz!=='我'&&p.hz!=='我们'&&K.has(p.hz)),PO:PRON.filter(p=>K.has(p.hz)),P2:PRON.filter(p=>['我','你','我们'].includes(p.hz)&&K.has(p.hz)),NP:SNP.filter(okz),NF:SNF.filter(okz),ADJ:SADJ.filter(okz),VO:SVO.filter(okz),PLI:SPL.filter(okz),PLT:SPL.filter(p=>p.to&&okz(p)),TM:STM.filter(okz)}[s]||[]}
const sentTier=K=>K.size>=45?3:K.size>=20?2:1;
function sentAvail(K){K=K||KNOWN();const tr=sentTier(K);return STPL.filter(t=>t.tier<=tr&&t.need.every(h=>K.has(h))&&t.sl.every(s=>slotItems(s,K).length))}
const pyOf=h=>{const w=WORDS.find(x=>x.hz===h&&x.lvl>0&&!x.chr);return w?pyText(w.py):(CHPY&&CHPY[h])||''};
function genSent(K){K=K||KNOWN();const av=sentAvail(K);if(!av.length)return null;for(let g=0;g<20;g++){const t=rnd(av),x={};let bad=false;t.sl.forEach(s=>{x[s]=rnd(slotItems(s,K))});if(x.P2&&x.P2.hz===x.P.hz)bad=true;if(x.PO&&x.PO.hz===(x.P||x.PX).hz)bad=true;if(x.NF&&x.NP&&x.NF.z[0]===x.NP.z[0])bad=true;if(bad)continue;
  const r=t.mk(x);return{ex:r.t.join(' '),ru:r.ru,py:r.t.map(pyOf).join(' '),p:r.q?'？':'。'}}return null}
function genSents(n){const K=KNOWN(),out=[],seen=new Set();for(let g=0;g<n*6&&out.length<n;g++){const s=genSent(K);if(s&&!seen.has(s.ex)){seen.add(s.ex);out.push(s)}}return out}

/* ---------- аккаунт, синхронизация, рейтинг ---------- */
let CLOUD={st:'local',db:null,user:null,uid:null,name:'',timer:null,busy:false,board:null,boardT:0,lastBoard:'',customDirty:false,owner:false};
function cloudQueue(){if(!CLOUD.db||CLOUD.st==='readonly')return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,2500)}
function boardDoc(){const days={};for(let k=0;k<14;k++){const d=new Date();d.setDate(d.getDate()-k);const key=dkey(d);days[key]=(S.days[key]&&S.days[key].xp)||0}
  return{xp:S.xp,streak:streak(),level:curLevel(),lessons:Object.keys(S.lessons).length,known:knownCount(),cards:srsCount(),days,last:dkey()}}
async function cloudPush(){if(!CLOUD.db||CLOUD.busy||CLOUD.st==='readonly')return;CLOUD.busy=true;
  try{const{custom,...rest}=S;await CLOUD.db.doc('data/users/'+CLOUD.uid+'/state').set({s:JSON.stringify(rest),t:S._t||Date.now()});
    if(CLOUD.customDirty){await CLOUD.db.doc('data/users/'+CLOUD.uid+'/custom').set({s:JSON.stringify(custom||{})});CLOUD.customDirty=false}
    const b=boardDoc(),bs=JSON.stringify(b);if(bs!==CLOUD.lastBoard){await CLOUD.db.doc('board/'+CLOUD.uid).set({...b,t:Date.now()});CLOUD.lastBoard=bs}CLOUD.st='sync'}
  catch(e){CLOUD.st=e&&e.code==='invalid_argument'?'readonly':'error'}CLOUD.busy=false}
async function cloudInit(){if(!window.claude||typeof window.claude.use!=='function'){SAMPLE=null;return}
  claude.use('sample').then(s=>{SAMPLE=s;if(view==='ai')render()},()=>{SAMPLE=null;if(view==='ai')render()});
  try{const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!db){CLOUD.st='local';return}
    const uid=await u.id();if(!uid)return;CLOUD.user=u;CLOUD.db=db;CLOUD.uid=uid;CLOUD.name=(await u.name().catch(()=>''))||'';CLOUD.owner=await u.isOwner().catch(()=>false);
    const snap=await db.doc('data/users/'+uid+'/state').get();
    if(snap.exists&&((snap.data()||{}).t||0)>(S._t||0)){const rem=JSON.parse(snap.data().s);const cs=await db.doc('data/users/'+uid+'/custom').get();rem.custom=cs.exists?JSON.parse((cs.data()||{}).s||'{}'):(S.custom||{});
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),rem);normS();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}rebuildAll();CH.msgs=S.chat;R=null;W.set=G.set=D.set=false;toast('Прогресс загружен из аккаунта')}
    else{CLOUD.customDirty=true}
    CLOUD.st='sync';await cloudPush();render()}catch(e){CLOUD.st='local'}}
async function loadBoard(force){if(!CLOUD.db||(!force&&Date.now()-CLOUD.boardT<60000))return;CLOUD.boardT=Date.now();
  try{const snap=await CLOUD.db.collection('board').get();const rows=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));const ps=await CLOUD.user.profiles(rows.map(r=>r.id)).catch(()=>({}));
    rows.forEach(r=>{const p=ps&&ps[r.id];r.name=(p&&p.name)||'Ученик';r.me=r.id===CLOUD.uid;r.avatar=p&&p.avatarUrl});CLOUD.board=rows.sort((a,b)=>(b.xp||0)-(a.xp||0));if(view==='today')render()}catch(e){}}
function accountLine(){return CLOUD.st==='sync'?`Вход выполнен${CLOUD.name?': '+esc(CLOUD.name):''}. Прогресс сохраняется в аккаунте и одинаков на телефоне и ноутбуке.`:CLOUD.st==='readonly'?'У тебя доступ только на просмотр, поэтому прогресс хранится в этом браузере. Попроси владельца дать доступ «Участник».':CLOUD.st==='error'?'Не удалось сохранить в аккаунт, прогресс пока в этом браузере. Повторю при следующем действии.':'Прогресс хранится в этом браузере. Открой страницу в Claude под своим аккаунтом, чтобы он сохранялся и синхронизировался.'}
function boardHTML(){if(!CLOUD.db)return'';loadBoard();const rows=CLOUD.board;
  const spark=r=>{const ks=Object.keys(r.days||{}).sort(),mx=Math.max(10,...ks.map(k=>r.days[k]));return`<span class="spark">${ks.map(k=>`<i style="height:${Math.max(2,r.days[k]/mx*100)}%" title="${k}: ${r.days[k]} XP"></i>`).join('')}</span>`};
  return`<section><div class="row" style="justify-content:space-between"><h2>Группа и рейтинг</h2><button class="btn ghost sm" data-a="board">Обновить</button></div>
    <p class="muted" style="font-size:13px">${CLOUD.owner?'Ты владелец: здесь видно, как каждый ученик занимается каждый день.':'Все, у кого есть ссылка и доступ «Участник», видят этот рейтинг.'}</p>
    ${!rows?'<p class="muted">Загружаю…</p>':`<div class="tbl"><table><thead><tr><th>#</th><th>Ученик</th><th>Ранг</th><th>XP</th><th>Сегодня</th><th>Серия</th><th>Уровень</th><th>14 дней</th></tr></thead><tbody>${rows.map((r,i)=>{const rk=RANKS[rankOf(r.xp||0)];return`<tr ${r.me?'style="font-weight:600"':''}><td>${i+1}</td><td>${esc(r.name)}${r.me?' <span class="chip">ты</span>':''}</td><td><span class="hz">${rk[1]}</span></td><td>${r.xp||0}</td><td>${(r.days&&r.days[dkey()])||0}</td><td>${r.streak||0}</td><td>${r.level?'HSK '+r.level:'Старт'}</td><td>${spark(r)}</td></tr>`}).join('')}</tbody></table></div>`}</section>`}

/* ---------- метод ---------- */
let resetArm=false;
views.method=()=>`<header class="ph"><p class="eyebrow">Методика</p><h1>Как устроена система и почему она работает</h1><p class="lead">Программа строится на четырёх навыках HSK — слух, чтение, письмо, речь — и на механизмах памяти, которые подтверждены исследованиями, а не на «зубрёжке списков».</p></header>
  <section><h2>Один урок — одна тема, все навыки</h2><div class="mech">
    <div><b>1. Слова</b><p>7–13 слов одной темы: звук, тон цветом, иероглиф по частям и графемам, перевод. Повторить вслух 3 раза.</p></div>
    <div><b>2. Письмо</b><p>2–3 ключевых иероглифа темы рукой: ручкой или кистью, сначала по образцу, потом по памяти.</p></div>
    <div><b>3. Грамматика</b><p>Одна модель через эталонную фразу, которую ты собираешь из слов.</p></div>
    <div><b>4. Практика</b><p>Значение, слух, тоны со сравнением на слух. Ошибки возвращаются в конец.</p></div>
    <div><b>5. Печать</b><p>Слова темы набираешь через пиньинь, как это делают в Китае.</p></div>
    <div><b>6. Диалог</b><p>Ролевая игра на тему урока: слушаешь партнёра и отвечаешь вслух. Потом слова и фразы уходят в повторение: 1 день → 3 дня → неделя → месяцы.</p></div></div>
    <p class="muted" style="max-width:72ch">Уровень закрывается тестом на 80%. После теста вся платформа переходит на следующий уровень: письмо, грамматика, игры и тоны берут слова нового уровня. Выученные слова приложения заменяют русские названия в меню на китайские.</p></section>
  <section class="card prose" style="max-width:none"><h3>Аккаунт и прогресс</h3><p>${accountLine()}</p>
    <p>Регистрация с паролем не нужна: страница узнаёт человека по его аккаунту Claude. Чтобы пригласить ученика, отправь ему ссылку через меню «Поделиться» и выдай доступ «Участник». Тогда его прогресс сохранится в аккаунте, а владелец увидит его в рейтинге на главной.</p></section>
  <section><h2>Механика: почему это сработает</h2><div class="mech">
    <div><b>Интервальное повторение</b><p>Память затухает по кривой. Повтор в момент почти-забывания удлиняет следующий интервал. Алгоритм SM-2 подбирает его под каждое слово отдельно.</p></div>
    <div><b>Активное припоминание</b><p>Вспомнить без подсказки сильнее, чем перечитать. Поэтому ответ скрыт, а оценку ставишь ты.</p></div>
    <div><b>Тоны парами</b><p>Тон звучит по-разному в зависимости от соседа. Пары тренируют то, что ты реально слышишь в речи и на экзамене.</p></div>
    <div><b>Иероглиф через ключи</b><p>Большинство знаков — сборка «смысл + чтение». 30 ключей превращают тысячи иероглифов в комбинации знакомых деталей.</p></div>
    <div><b>Грамматика как шаблон</b><p>Фраза-эталон работает как формула: подставляешь новые слова и сразу говоришь.</p></div>
    <div><b>Понятный инпут</b><p>Ежедневно слушай материал, где ты понимаешь 80–90%. Так растёт скорость восприятия, которой не даёт ни одна карточка.</p></div></div></section>
  <section><h2>Что добавится на HSK 5–6</h2><div class="mech">
    <div><b>成语 · устойчивые выражения</b><p>Четыре иероглифа со своей историей, на HSK 5–6 их сотни: 马马虎虎 — кое-как, 一模一样 — точь-в-точь, 半途而废 — бросить на полпути, 入乡随俗 — в чужом краю живи по его обычаям, 画蛇添足 — дорисовать змее ноги, то есть сделать лишнее. Учатся как слова: в повторение вместе с историей.</p></div>
    <div><b>书面语 · письменный стиль</b><p>В текстах HSK 5–6 разговорные слова заменяются книжными: 因为 → 由于, 但是 → 然而, 所以 → 因此, 和 → 与, 很 → 十分 или 极其, 在 → 于. Без этого слоя длинные тексты кажутся «другим языком».</p></div>
    <div><b>Слова из морфем</b><p>С HSK 4 новые слова собираются из знакомых иероглифов: 电 «электричество» → 电脑, 电话, 电视, 电梯; 机 «машина» → 手机, 飞机, 机场. Это продолжение метода графем на уровне слов.</p></div>
    <div><b>Скорость чтения</b><p>На HSK 6 50 вопросов к длинным текстам при жёстком таймере. Скорость растёт только от объёма: с HSK 3 ежедневно читай адаптированные книги по уровню, с HSK 5 — новости и статьи.</p></div>
    <div><b>Письмо HSK 6 · изложение</b><p>10 минут читаешь текст около 1000 иероглифов, затем без него за 35 минут пересказываешь своими словами примерно в 400 иероглифах. Тренируй с HSK 4: пересказывай прочитанные тексты письменно.</p></div>
    <div><b>Аудирование HSK 5–6</b><p>Интервью, лекции, длинные монологи на естественной скорости. С HSK 4 смотри видео и слушай подкасты без субтитров, сначала узнавая тему, потом детали.</p></div></div>
    <p class="muted" style="font-size:13px;max-width:72ch">Словари HSK 3–6 загружаются во вкладке «Путь» по уровням. Методика, грамматика уровней 3–6, иероглифика и разговорная практика уже работают на весь путь.</p></section>
  <section class="two"><div class="card prose"><h3>Где система развалится</h3><ul>
    <li><b>Пропуски больше 2 дней.</b> Повторения копятся в хвост, и вход в приложение становится тяжёлым. Лучше 15 минут каждый день, чем 3 часа в выходные.</li>
    <li><b>Новое вместо повторения.</b> Если карточек к повтору больше 100, новые уроки ставь на паузу.</li>
    <li><b>Слова без звука.</b> Не узнаешь их на слух — а аудирование это 40–50% баллов.</li>
    <li><b>Без письма рукой</b> провалишь письменную часть с HSK 3.</li>
    <li><b>Только приложение.</b> С HSK 3 нужен живой разговор: репетитор или языковой партнёр 1–2 раза в неделю.</li></ul></div>
  <div class="card prose"><h3>Критерии перехода на уровень выше</h3><ul>
    <li>90% слов уровня в статусе «усвоено» (интервал от 21 дня).</li>
    <li>Все модели грамматики уровня собираешь без ошибок.</li>
    <li>Пробный тест уровня — от 80% баллов (с запасом к проходным 60%).</li>
    <li>Тренажёр пар тонов — от 85% верных подряд на 40 вопросах.</li></ul>
    <h3>Подготовка к экзамену</h3><ul><li>За 4–6 недель — пробные тесты раз в неделю на официальном сайте chinesetest.cn, строго по таймеру.</li><li>Каждую ошибку разбирай: слово в повторение, конструкцию в шаблоны.</li></ul></div></section>
  <section><h2>Уровни и нагрузка</h2><div class="tbl"><table><thead><tr><th>Уровень</th><th>Слов</th><th>Иероглифов</th><th>Часов с нуля</th><th>При 1 ч/день</th><th>Экзамен</th></tr></thead><tbody>
    <tr><td><b>Этап 0</b></td><td>~40 фраз</td><td>—</td><td>15–25</td><td>2–3 нед</td><td>—</td></tr>
    ${LV.map(x=>{const[a,b]=x.hours.split('–').map(Number);return`<tr><td><b>HSK ${x.n}</b></td><td>${x.words}</td><td>${x.chars}</td><td>${x.hours}</td><td>${Math.round(a/30)}–${Math.round(b/30)} мес</td><td>${x.exam}</td></tr>`}).join('')}</tbody></table></div>
    <p class="muted" style="font-size:13px;max-width:72ch">Часы — ориентир для русскоговорящих при регулярных занятиях, у разных школ оценки расходятся. Словари уровней построены по HSK 2.0 (150 → 5000 слов). В 2026 экзамен переходит на HSK 3.0: 9 уровней, на первом уровне 500 слов вместо 150, письмо иероглифов от руки с первого уровня, устная часть с третьего. Поэтому письмо и речь здесь тренируются с первого дня. Перед записью на экзамен уточни формат в своём тестовом центре.</p></section>
  <section><h2>Настройки</h2><div class="card" style="display:grid;gap:16px">
    ${voiceBanner()}

    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=N||yy>=N||!sk[yy*N+xx])continue;sxx+=i*i;syy+=j*j;sxy+=i*j}
    let th=.5*Math.atan2(2*sxy,sxx-syy);if(th<0)th+=Math.PI;ch[Math.round(th/(Math.PI/4))%4][y*N+x]+=1}
  const K=[],sg=REC.sg,rad=Math.ceil(sg*3);let ks=0;for(let i=-rad;i<=rad;i++){const v=Math.exp(-i*i/(2*sg*sg));K.push(v);ks+=v}K.forEach((v,i)=>K[i]=v/ks);
  const out=new Float32Array(RFD),tmp=new Float32Array(N*N),bl=new Float32Array(N*N);let n2=0;
  ch.forEach((c,ci)=>{tmp.fill(0);bl.fill(0);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=0;for(let i=-rad;i<=rad;i++){const xx=x+i;if(xx>=0&&xx<N)v+=c[y*N+xx]*K[i+rad]}tmp[y*N+x]=v}
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=0;for(let j=-rad;j<=rad;j++){const yy=y+j;if(yy>=0&&yy<N)v+=tmp[yy*N+x]*K[j+rad]}bl[y*N+x]=v}
    const st=N/RG;for(let gy=0;gy<RG;gy++)for(let gx=0;gx<RG;gx++){const v=Math.sqrt(bl[Math.floor(gy*st+st/2)*N+Math.floor(gx*st+st/2)]);out[ci*RG*RG+gy*RG+gx]=v;n2+=v*v}});

function recMap(strokes,N){ // общая нормализация по рамке знака; возвращает преобразование точки
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(s=>s.forEach(p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}));

  const tw=Math.max(x1-x0,10),th=Math.max(y1-y0,10),size=Math.max(tw,th),be=REC.beta,L=N-1-2*2.5,kx=((tw/size)*(1-be)+be)*L/tw,ky=((th/size)*(1-be)+be)*L/th;

function recRaster(strokes,N=RN){ // штрихи [[x,y]…] → скелет

  strokes.forEach(s=>{const P=s.map(p=>[m.px(p),m.py(p)]);if(P.length===1){put(P[0][0],P[0][1]);return}
    for(let i=1;i<P.length;i++){const a=P[i-1],c=P[i],n=Math.max(1,Math.ceil(Math.hypot(c[0]-a[0],c[1]-a[1])*2));for(let j=0;j<=n;j++)put(a[0]+(c[0]-a[0])*j/n,a[1]+(c[1]-a[1])*j/n)}});

function recResample(s,K){if(s.length===1)return Array.from({length:K},()=>[s[0][0],s[0][1]]);const L=[0];for(let i=1;i<s.length;i++)L.push(L[i-1]+Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]));const T=L[L.length-1]||1,o=[];let j=1;for(let k=0;k<K;k++){const d=T*k/(K-1);while(j<s.length-1&&L[j]<d)j++;const u=(d-L[j-1])/((L[j]-L[j-1])||1);o.push([s[j-1][0]+(s[j][0]-s[j-1][0])*u,s[j-1][1]+(s[j][1]-s[j-1][1])*u])}return o}
function recPrep(strokes){ // → {f, n, ns} либо null
  let st=strokes.filter(s=>s.length&&(s.length>1||true));if(!st.length)return null;
  const all=[].concat(...st);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;all.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
  const size=Math.max(x1-x0,y1-y0,1),len=s=>{let l=0;for(let i=1;i<s.length;i++)l+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]);return l};
  st=st.filter(s=>len(s)>=.025*size||st.length===1);if(!st.length)return null;
  const sk=recRaster(st);if(!sk)return null;const m=recMap(st,1);
  const ns=st.map(s=>recResample(s.map(p=>[(p[0]-(x0+x1)/2)*m.kx,(p[1]-(y0+y1)/2)*m.ky]),8));
  return{f:recFeat(sk),n:st.length,ns}}
function recTemplate(c){const m=medOf(c);if(!m)return null;const segs=m.map(s=>s.map(p=>[p[0]*100,p[1]*100]));const u=recPrep(segs);return u?{c,n:u.n,f:u.f,ns:u.ns}:null}
function recReady(){if(!REC.tpl){REC.tpl=[];REC.byc={};CHARS.forEach(it=>{const t=recTemplate(it.c);if(t){REC.tpl.push(t);REC.byc[t.c]=t}})}return Promise.resolve(REC.tpl)}
function recOrd(u,t){let s=0;for(let i=0;i<u.length;i++){let a=0,b=0;for(let k=0;k<8;k++){a+=Math.hypot(u[i][k][0]-t[i][k][0],u[i][k][1]-t[i][k][1]);b+=Math.hypot(u[i][k][0]-t[i][7-k][0],u[i][k][1]-t[i][7-k][1])}s+=Math.min(a,b+.06*8)/8}return s/u.length}
function recDist(u,t){let d=0;for(let i=0;i<RFD;i++){const e=u.f[i]-t.f[i];d+=e*e}d=Math.sqrt(d);
  return d+.03*Math.abs(u.n-t.n)+(u.n===t.n?.35*recOrd(u.ns,t.ns):.12)}
function recRank(strokes){ // все образцы по близости: [{c,score}]
  if(!REC.tpl)return[];const u=recPrep(strokes);if(!u)return[];
  return REC.tpl.map(t=>({c:t.c,score:recDist(u,t)})).sort((a,b)=>a.score-b.score)}
function recMatch(strokes,k=5){return recRank(strokes).slice(0,k)}
/* Проверка «этот ли знак»: когда нужный знак известен, сравниваем с ним, а не просто берём лучший.
   ok — система узнала именно его; close — он второй по похожести и почти не хуже первого (парные знаки, неровный почерк); bad — другой знак. */
function recVerify(strokes,target){
  if(!strokes||!strokes.length)return{state:'empty'};
  if(!REC.byc||!REC.byc[target])return{state:'unknown'};
  const r=recRank(strokes);if(!r.length)return{state:'empty'};
  const rk=r.findIndex(x=>x.c===target),best=r[0],sc=r[rk].score;
  if(rk===0)return{state:'ok',top:best.c,rank:0};

/* разбиение рукописной строки на знаки */
function sbox(s){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;s.forEach(p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]});return{x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2}}
function recSegment(strokes,o={}){ // o.cell, o.ox, o.oy, o.rh, o.ph — режим клеток; иначе эвристика по зазорам
  const items=strokes.map(s=>({s,b:sbox(s)}));if(!items.length)return[];
  if(o.cell){const rh=o.rh||o.cell,ph=o.ph||0,m=new Map();
    items.forEach(it=>{const col=Math.floor((it.b.cx-o.ox)/o.cell),row=Math.floor((it.b.cy-o.oy)/rh);if((it.b.cy-o.oy-row*rh)<ph)return; // строка пиньинь — не знак
      const key=row*1000+col;if(!m.has(key))m.set(key,{row,col,strokes:[]});m.get(key).strokes.push(it.s)});
    return[...m.values()].sort((a,b)=>a.row-b.row||a.col-b.col)}
  const sizes=items.map(it=>Math.max(it.b.w,it.b.h)).sort((a,b)=>a-b),S=Math.max(30,sizes[Math.min(sizes.length-1,Math.floor(sizes.length*.9))]*1.1||30);
  const lines=[];items.slice().sort((a,b)=>a.b.y0-b.b.y0).forEach(it=>{const l=lines[lines.length-1];if(l&&it.b.y0<=l.y1+.1*S){l.it.push(it);l.y1=Math.max(l.y1,it.b.y1)}else lines.push({it:[it],y0:it.b.y0,y1:it.b.y1})});
  const out=[];lines.sort((a,b)=>a.y0-b.y0).forEach((l,row)=>{const g=[];
    l.it.sort((a,b)=>a.b.x0-b.b.x0).forEach(it=>{const last=g[g.length-1];

    g.forEach((c,col)=>out.push({row,col,strokes:c.strokes}))});

/* слова и пиньинь для распознанной строки */
function recWords(){if(REC.wmap)return REC.wmap;const m=new Map();WORDS.forEach(w=>{if(w.gr||w.chr||!w.hz||!aligned(w))return;if(!m.has(w.hz))m.set(w.hz,w)});return REC.wmap=m}
function recRead(text){ // жадная разбивка на слова из приложения → [{hz,py:[слоги],ru}]
  const m=recWords(),cs=[...text],out=[];let i=0;
  while(i<cs.length){let done=false;
    for(let n=Math.min(6,cs.length-i);n>=2&&!done;n--){const w=m.get(cs.slice(i,i+n).join(''));if(w){out.push({hz:w.hz,py:syls(w),ru:w.ru});i+=n;done=true}}
    if(!done){const it=CHM[cs[i]];out.push({hz:cs[i],py:[it?it.py:''],ru:it?charMean(cs[i]):''});i++}}
  return out}

/* пиньинь: ввод с клавиатуры (тоновые знаки, цифры ni3 hao3, v = ü) */
const PYM={a:'āáǎà',e:'ēéěè',o:'ōóǒò',i:'īíǐì',u:'ūúǔù','ü':'ǖǘǚǜ'};

  let k=body.search(/[aä]/);if(k<0)k=body.indexOf('e');if(k<0){const ou=body.indexOf('ou');k=ou>=0?ou:-1}
  if(k<0){for(let i=body.length-1;i>=0;i--)if('aeiouü'.includes(body[i])){k=i;break}}
  if(k<0)return body;const v=body[k];return body.slice(0,k)+(PYM[v]?PYM[v][tone-1]:v)+body.slice(k+1)}
function pyNorm(s){const toks=String(s||'').toLowerCase().match(/[a-zü:vāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+[1-5]?/g)||[];return toks.map(pyMark).join('')}
function pyExp(syl){return(Array.isArray(syl)?syl.join(''):String(syl||'')).toLowerCase().replace(/[\s'’-]/g,'').replace(/…/g,'')}
function pyCheck(input,expected){ // 'ok' — совпало с тонами; 'tone' — слоги те же, тон не тот или не указан; 'bad'
  const a=pyNorm(input),b=pyExp(expected);if(!a)return'empty';if(a===b)return'ok';
  const bare=x=>sylBase(x).replace(/[^a-zü]/g,'');if(bare(a)===bare(b))return'tone';return'bad'}

/* универсальное поле для письма */
function mkPad(cv,o){ // o: w,h (логические), ink(), tool(), pw, guide(ctx), onStart(), onEnd(erase), strokes
  const st=o.strokes||[];cv.width=o.w;cv.height=o.h;const x=cv.getContext('2d');let cur=null;

    st.forEach(s=>{if(s.length===1){x.beginPath();x.arc(s[0][0],s[0][1],(s[0][2]||o.pw)/2,0,7);x.fill();return}
      for(let i=1;i<s.length;i++){x.beginPath();x.lineWidth=(s[i-1][2]+s[i][2])/2||o.pw;x.moveTo(s[i-1][0],s[i-1][1]);x.lineTo(s[i][0],s[i][1]);x.stroke()}});if(o.over)o.over(x)}

  const wOf=e=>o.pw*(e.pointerType==='pen'&&e.pressure>0?.6+e.pressure*.8:1);
  function erase(p){const r=o.pw*5;let hit=false;for(let i=st.length-1;i>=0;i--)if(st[i].some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<r)){st.splice(i,1);hit=true}if(hit)draw();return hit}

    if(o.tool&&o.tool()==='erase'){cur='erase';erase(p);return}

  cv.onpointermove=e=>{if(!cur)return;const p=pt(e);if(cur==='erase'){erase(p);return}
    const q=cur[cur.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])<o.w/400+.8)return;cur.push([p[0],p[1],wOf(e)]);draw()};
  cv.onpointerup=cv.onpointercancel=()=>{if(!cur)return;const was=cur;cur=null;draw();if(o.onEnd)o.onEnd(was==='erase')};
  draw();return{strokes:st,draw,undo(){st.pop();draw();if(o.onEnd)o.onEnd(true)},clear(){st.length=0;draw();if(o.onEnd)o.onEnd(true)}}}
function fitBox(cv,boxW,boxH,ratio){let w=boxW,h=w/ratio;if(h>boxH){h=boxH;w=h*ratio}cv.style.width=Math.max(120,w)+'px';cv.style.height=Math.max(120/ratio,h)+'px'}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* тетрадная разлиновка: клетка 田字格 и строка пиньинь (четыре линии, три промежутка) */

function paperPy(x,x0,y0,w,h,o={}){x.save();x.strokeStyle=o.line||cssv('--line');x.lineWidth=Math.max(1,h/28);x.setLineDash([]);
  for(let k=0;k<4;k++){const y=y0+h*.1+k*(h*.8/3);x.setLineDash(k===1||k===2?[h/10,h/14]:[]);x.beginPath();x.moveTo(x0,y);x.lineTo(x0+w,y);x.stroke()}x.restore()}

/* анимация порядка черт по осевым линиям */
const ANIM={raf:0,tok:0};

function animStroke(x,pts,upto,W,col){ // кисть: к концу штриха линия утоньшается

function animPlay(cv,ch,onDone){
  const m=medOf(ch);if(!m){return false}animStop();const tok=ANIM.tok,W=cv.width,pad=W*.1,x=cv.getContext('2d');
  const P=m.map(s=>smoothPts(s.map(p=>[pad+p[0]*(W-2*pad),pad+p[1]*(W-2*pad)]),8));
  const len=s=>{let l=0;for(let i=1;i<s.length;i++)l+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]);return l};
  const dur=P.map(s=>Math.max(380,Math.min(900,len(s)*3.1))),gap=200,total=dur.reduce((a,d)=>a+d+gap,0);

  function frame(now){if(tok!==ANIM.tok)return;const t=now-t0;x.clearRect(0,0,W,W);
    paperCell(x,0,0,W);paperGlyph(x,ch,W/2,W/2,W,cssv('--muted'),.12);
    let acc_t=0;P.forEach((s,i)=>{const st=acc_t,en=st+dur[i];acc_t=en+gap;
      if(t>=en){animStroke(x,s,1,W,ink)}else if(t>st){animStroke(x,s,(t-st)/dur[i],W,acc)}

    if(t<total+400)ANIM.raf=requestAnimationFrame(frame);else{ANIM.raf=0;if(onDone)onDone()}}
  ANIM.raf=requestAnimationFrame(frame);return true}
function animHTML(ch,note){const m=medOf(ch);if(!m)return`<div class="card"><span class="hz" style="font-size:44px">${esc(ch)}</span> <span class="muted">Для этого знака нет данных о порядке черт.</span></div>`;
  const it=CHM[ch];return`<div class="animbox card"><canvas class="animc" width="360" height="360" data-ch="${esc(ch)}" aria-label="Порядок черт знака ${esc(ch)}"></canvas>
    <div class="animside"><div class="hz" style="font-size:40px;line-height:1">${esc(ch)}</div>${it?`<div class="py ${'t'+sylTone(it.py)}"><b>${esc(it.py)}</b> · ${esc(charMean(ch))}</div>`:''}<div class="muted" style="font-size:13px">Черт: ${m.length}. Цифра — где начинать каждую черту.${note?' '+esc(note):''}</div>
    <div class="row"><button class="btn sm" data-a="animre" data-c="${esc(ch)}">Ещё раз</button>${playBtn(ch)}</div></div></div>`}
function animMount(root){const cv=(root||document).querySelector('.animc');if(cv)animPlay(cv,cv.dataset.ch)}

Object.assign(act,{
  tuquick:d=>{const q=[`Сделай тест в виде карточек из моих выбранных слов. Заданий: ${TU.n}.`,`Сделай квиз с вариантами ответов по моим выбранным словам. Заданий: ${TU.n}.`,`Дай задания на составление предложений из моих выбранных слов. Заданий: ${TU.n}.`,`Сделай тест на письмо иероглифов по моим выбранным словам. Слов: ${Math.min(TU.n,12)}.`,'Посмотри мои результаты тестов и дай тренировку на слабые места.'];tuSend(q[+d.i])},
  tutest:d=>{const m=TU.msgs[+d.i];if(!m||!m.test)return;const q=tuQueue(m.test);if(!q.length){toast('В тесте нет заданий, которые можно запустить');return}tsStart('ai',{queue:q,title:m.test.title||'Тест репетитора',ids:[],n:0})},
  tumatdel:d=>{TU.mat.splice(+d.i,1);tuSaveMat();render()},
  tuclear:()=>{TU.msgs=[];TU.err='';tuSave();render()}
});
document.addEventListener('submit',e=>{if(e.target.dataset&&e.target.dataset.form==='tu'){e.preventDefault();const i=$('#tuin');if(i)tuSend(i.value)}});
document.addEventListener('keydown',e=>{if(e.target.id==='tuin'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();tuSend(e.target.value)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='tun'){TU.n=Math.max(2,Math.min(40,+t.value||10));t.value=TU.n}
  if(t.id==='tulesson'&&t.value){const[l,n,title]=t.value.split('|');t.value='';tuSend(`Сделай тест в виде карточек из урока ${n} HSK ${l} «${title}». Заданий: ${TU.n}.`)}
  if(t.id==='tucode'){TU.code=t.value;try{localStorage.setItem('hskput.code',TU.code)}catch(e){}}
  if(t.id==='tumat'&&t.files)[...t.files].forEach(f=>{if(f.size>400000){toast('Файл больше 400 КБ: '+f.name);return}const r=new FileReader();r.onload=()=>{TU.mat.push({name:f.name,text:String(r.result||''),on:true});tuSaveMat();if(view==='tutor')render()};r.readAsText(f)})});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.pk){const s=selSet();if(t.checked)s.add(t.dataset.pk);else s.delete(t.dataset.pk);S.sel=[...s];save();t.closest('.pkrow').classList.toggle('on',t.checked);const e2=$('#pkstat');if(e2)e2.innerHTML=pkStats()}
  if(t.dataset&&t.dataset.mat!=null&&t.dataset.mat!==''){TU.mat[+t.dataset.mat].on=t.checked;tuSaveMat()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='pkq'){PK.q=t.value;pkSync()}if(t.id==='tuin')TU.draft=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pkunit'){PK.unit=t.value;render()}if(t.id==='pkn'){PK.n=+t.value}});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&BD.full&&view==='board'){BD.full=false;render();bdFS()}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&BD.full&&view==='board'){BD.full=false;render()}else setTimeout(bdFit,60)});
window.addEventListener('resize',()=>{if(view==='board')setTimeout(bdFit,60)});
let rz;window.addEventListener('resize',()=>{if(view!=='write'&&!(view==='lesson'&&$('#pad')))return;clearTimeout(rz);rz=setTimeout(render,200)});

buildChars();
render();
cloudInit();
</script>
