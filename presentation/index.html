<title>Многоуровневые парковки Бишкека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap">
<style>
/* Концепт: сцена 1920×1080 поверх живого WebGL-фона. Тёмный графит и серая студия (как в референсе-видео),
   жёлтый «P» из проекта как единственный акцент, бирюза только для данных. */
:root{
  --navy:#0E1726; --navy2:#16233A; --navy3:#22324F;
  --paper:#F2EFE8; --card:#FFFFFF;
  --yellow:#FFB600; --amber:#B97800;
  --teal:#2EC4B6; --teal-d:#0C7468;
  --red:#E63946; --red-d:#B3202C;
  --ink:#0E1726; --ink-mut:#4F5A6D;
  --on-dark:#F4F1EA; --on-dark-mut:#A9B5C8;
  --line-light:#D9D4C8; --line-dark:#2C3D5C;
  --ease:cubic-bezier(.2,.75,.2,1);
  --font:'Montserrat','Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#5a5e66;color:var(--on-dark);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#bg{position:fixed;inset:0;background:radial-gradient(120% 100% at 70% 15%,#868a92 0%,#6a6e76 50%,#45484f 100%)}
#bgdark{position:fixed;inset:0;background:radial-gradient(100% 80% at 50% 50%,#10141b 0%,#05070a 100%);opacity:var(--dark,0);pointer-events:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .6s var(--ease)}
#gl.show{opacity:1}
#viewport{position:fixed;inset:0;padding:0 16px;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .55s var(--ease),visibility 0s .55s}
.slide.on{visibility:visible;opacity:1;transition:opacity .55s var(--ease)}
.t-paper{background:var(--paper);color:var(--ink)}
.t-navy{background:var(--navy);color:var(--on-dark)}
.t-clear{background:transparent;color:#fff}
.t-clear.light{color:var(--ink)}

/* типографика */
.kick{position:absolute;left:120px;top:84px;font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-d)}
.t-navy .kick{color:var(--teal)}
.t-clear .kick{color:var(--yellow)}
h2{position:absolute;left:120px;top:128px;right:120px;font-size:68px;line-height:1.05;font-weight:800;letter-spacing:-.025em;text-wrap:balance;max-width:1500px}
h2 i{font-style:normal;color:var(--amber)}
.t-navy h2 i,.t-clear h2 i{color:var(--yellow)}
.body{position:absolute;left:120px;right:120px;top:300px;bottom:128px}
p,li{text-wrap:pretty}
.lead{font-size:32px;line-height:1.45;font-weight:500;max-width:1100px}
.mut{color:var(--ink-mut)} .t-navy .mut{color:var(--on-dark-mut)}
.cap{font-size:20px;line-height:1.4;font-weight:500;color:var(--ink-mut)}
.t-navy .cap{color:var(--on-dark-mut)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.foot{position:absolute;left:120px;right:120px;bottom:44px;display:flex;justify-content:space-between;font-size:20px;font-weight:500;color:var(--ink-mut)}
.t-navy .foot,.t-clear .foot{color:var(--on-dark-mut)}
.src{position:absolute;left:120px;right:120px;bottom:84px;font-size:18px;line-height:1.35;color:var(--ink-mut);font-weight:500}
.t-navy .src{color:var(--on-dark-mut)}
.t-clear .src{color:#E6E9EF}
.src b{font-weight:700}

/* движение: появление со сдвигом, шаг задержки 70 мс */
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s var(--ease) calc(var(--d,0)*70ms + 260ms),transform .9s var(--ease) calc(var(--d,0)*70ms + 260ms)}
.on .rv{opacity:1;transform:none}
.rv-x{opacity:0;transform:translateX(-40px);transition:opacity .8s var(--ease) calc(var(--d,0)*70ms + 260ms),transform .9s var(--ease) calc(var(--d,0)*70ms + 260ms)}
.on .rv-x{opacity:1;transform:none}
.rv-s{opacity:0;transform:scale(.86);transform-origin:center;transition:opacity .7s var(--ease) calc(var(--d,0)*70ms + 260ms),transform .9s var(--ease) calc(var(--d,0)*70ms + 260ms)}
.on .rv-s{opacity:1;transform:none}

/* карточки */
.grid{display:grid;gap:24px}
.card{background:var(--card);border-radius:24px;padding:36px 40px}
.t-navy .card{background:var(--navy2)}
.card.dk{background:var(--navy);color:var(--on-dark)}
.card h3{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.card p{font-size:24px;line-height:1.45;font-weight:500;margin-top:12px}
.big{font-size:84px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-paper .big{color:var(--amber)} .card.dk .big,.t-navy .big{color:var(--yellow)}

/* логотип P */
.plogo{position:absolute;right:120px;top:76px;width:84px;height:84px;border-radius:22px;background:var(--yellow);display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:60px;line-height:1}

/* обложка */
.cover-txt{position:absolute;left:120px;top:250px;width:1000px}
.cover-txt .kick{position:static;margin-bottom:36px;color:var(--yellow)}
.cover-txt h1{font-size:104px;line-height:1.0;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.cover-txt .sub{font-size:34px;line-height:1.4;font-weight:500;margin-top:40px;color:#EDEFF3;max-width:820px}
.cover-txt .who{font-size:24px;line-height:1.6;font-weight:500;margin-top:56px;color:#DDE1E8}
.cover-txt .who span{color:#C3CAD6}
.hint{position:absolute;left:120px;bottom:60px;display:flex;gap:18px;align-items:center;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.hint i{width:56px;height:2px;background:var(--yellow);display:block;transform-origin:left;animation:hint 2.4s var(--ease) infinite}
@keyframes hint{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.2}}
.topnav{position:absolute;left:120px;right:120px;top:64px;display:flex;justify-content:space-between;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}

/* сцена «продукт» */
.chap{position:absolute;left:120px;top:340px;display:flex;flex-direction:column;gap:22px;font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.chap div{display:flex;gap:18px;align-items:center;color:rgba(255,255,255,.45);transition:color .5s var(--ease),transform .5s var(--ease)}
.chap div b{display:block;width:34px;height:2px;background:currentColor;transition:width .5s var(--ease)}
.chap div.a{color:#fff;transform:translateX(10px)} .chap div.a b{width:86px;background:var(--yellow)}
.capt{position:absolute;left:120px;bottom:150px;width:760px;font-size:34px;line-height:1.35;font-weight:700;letter-spacing:-.01em;min-height:140px}
.capt span{position:absolute;left:0;top:0;opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.capt span.a{opacity:1;transform:none}
.hud{position:absolute;right:120px;top:340px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s}
.hud.a{opacity:1}
.hud small{display:block;font-size:20px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7)}
.hud b{font-size:150px;line-height:1;letter-spacing:-.04em;color:var(--yellow)}
.ctl{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;align-items:center;gap:20px;width:760px}
.ctl button{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(10,14,22,.35);color:#fff;font-size:20px;cursor:pointer;font-family:var(--font);backdrop-filter:blur(6px)}
.ctl button:hover,.ctl button:focus-visible{background:var(--yellow);border-color:var(--yellow);color:var(--navy);outline:none}
.ctl input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.35);outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:0;cursor:pointer}
.ctl input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--yellow);border:0;cursor:pointer}
.ctl input[type=range]:focus-visible{box-shadow:0 0 0 3px var(--yellow)}
.ctl .cap{color:#fff;width:90px;text-align:right}

/* прогресс и навигация */
#prog{position:fixed;left:0;top:0;height:4px;background:var(--yellow);width:0;transition:width .6s var(--ease);z-index:5}
.navb{position:fixed;top:0;bottom:0;width:7vw;z-index:4;background:none;border:0;cursor:pointer;opacity:0}
.navb:focus-visible{opacity:1;outline:3px solid var(--yellow);outline-offset:-6px}
#prev{left:0}#next{right:0}

/* графики */
.bars{display:grid;gap:18px;align-items:center}
.brow{display:grid;grid-template-columns:420px 1fr 120px;align-items:center;gap:24px;font-size:26px;font-weight:600}
.brow .tr{height:34px;border-radius:10px;background:rgba(14,23,38,.07);overflow:hidden}
.brow .fl{height:100%;border-radius:10px;background:var(--teal);width:calc(var(--w)*1%);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease) calc(var(--d,0)*90ms + 500ms)}
.on .brow .fl{transform:scaleX(1)}
.brow .fl.y{background:var(--yellow)}
.brow b{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.t-navy .brow .tr{background:rgba(255,255,255,.08)}

.vbars{display:flex;align-items:flex-end;gap:36px;height:520px;border-bottom:3px solid var(--navy)}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;height:100%}
.vb .col{width:100%;height:calc(var(--h)*1%);border-radius:18px 18px 0 0;background:var(--navy3);transform:scaleY(0);transform-origin:bottom;transition:transform 1.1s var(--ease) calc(var(--d,0)*140ms + 500ms)}
.on .vb .col{transform:scaleY(1)}
.vb.hi .col{background:var(--yellow)}
.vb .v{font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.vlab{display:flex;gap:36px;margin-top:16px}
.vlab span{flex:1;text-align:center;font-size:26px;font-weight:700}

/* таблицы-сетки */
.tbl{display:grid;gap:0;font-size:24px;line-height:1.4;font-weight:500}
.tbl>div{padding:22px 26px;border-bottom:1px solid var(--line-light)}
.tbl .h{font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mut);border-bottom:2px solid var(--ink)}
.tbl b{font-weight:800}

.tag{display:inline-block;font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:var(--navy);color:var(--on-dark)}
.tag.y{background:var(--yellow);color:var(--navy)}
.tag.t{background:var(--teal);color:var(--navy)}

/* дерево */
.tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tree path{fill:none;stroke:#5A6C8E;stroke-width:3;stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);transition:stroke-dashoffset 1.2s var(--ease) calc(var(--d,0)*90ms + 700ms)}
.on .tree path{stroke-dashoffset:0}
.t-paper .tree path{stroke:#B9B3A4}
.node{position:absolute;border-radius:20px;padding:22px 28px;font-size:25px;line-height:1.35;font-weight:600;display:flex;align-items:center}
.t-navy .node{background:var(--navy2)}
.node.core{background:var(--yellow);color:var(--navy);font-size:36px;font-weight:800;justify-content:center;text-align:center;letter-spacing:-.01em}
.node.goal{background:var(--navy);color:var(--on-dark);font-size:34px;font-weight:800;justify-content:center;text-align:center}
.t-paper .node:not(.goal):not(.core){background:#fff}
.lbl{position:absolute;font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.t-paper .lbl{color:var(--teal-d)}

/* SWOT */
.sw{padding:36px 40px;border-radius:24px;background:#fff;border-top:10px solid var(--c)}
.sw h3{font-size:34px;font-weight:800;color:var(--cd);letter-spacing:-.01em;margin-bottom:18px}
.sw li{list-style:none;font-size:26px;line-height:1.35;font-weight:500;padding:8px 0 8px 30px;position:relative}
.sw li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--c)}

/* спайдер */
.radar .ring{fill:none;stroke:#CFC9BB;stroke-width:1.5}
.radar .axis{stroke:#CFC9BB;stroke-width:1.5}
.radar .poly{transform-box:view-box;transform-origin:360px 360px;transform:scale(0);transition:transform 1.3s var(--ease) 700ms}
.radar .poly.b{transition-delay:1400ms}
.on .radar .poly{transform:scale(1)}
.radar text{font-family:var(--font);font-size:23px;font-weight:700;fill:var(--ink)}

/* Гант */
.gantt{position:absolute;left:0;right:0;top:0}
.g-head{display:grid;grid-template-columns:470px 1fr;font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--on-dark-mut)}
.g-q{display:grid;grid-template-columns:repeat(12,1fr)}
.g-q span{padding:6px 0 10px 8px;border-left:1px solid var(--line-dark)}
.g-row{display:grid;grid-template-columns:470px 1fr;align-items:center;height:104px;border-top:1px solid var(--line-dark)}
.g-row .l{display:flex;gap:22px;align-items:center;padding-right:24px}
.g-row .l em{font-style:normal;font-size:44px;font-weight:800;color:var(--yellow);width:44px;font-variant-numeric:tabular-nums}
.g-row .l div{font-size:25px;font-weight:700;line-height:1.2}
.g-row .l small{display:block;font-size:18px;font-weight:500;color:var(--on-dark-mut);margin-top:4px}
.g-tr{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/12 - 1px),var(--line-dark) calc(100%/12 - 1px),var(--line-dark) calc(100%/12))}
.g-bar{position:absolute;top:32px;height:40px;left:calc(var(--s)*100%/36);width:calc(var(--n)*100%/36);border-radius:12px;background:var(--yellow);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease) calc(var(--d,0)*110ms + 600ms)}
.on .g-bar{transform:scaleX(1)}
.g-bar.h{background:repeating-linear-gradient(135deg,rgba(255,182,0,.9) 0 8px,rgba(255,182,0,.25) 8px 16px)}
.g-bar.t{background:var(--teal)}

/* бюджет */
.bud-tile{background:var(--navy);color:var(--on-dark);border-radius:28px;padding:52px 52px}
.bud-tile .big{font-size:132px;color:var(--yellow)}
.bud-tile p{font-size:30px;line-height:1.35;font-weight:500;margin-top:20px;color:var(--on-dark)}

/* таблица окупаемости */
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.pay .c{background:var(--navy2);border-radius:24px;padding:36px 40px}
.pay .c .y{font-size:26px;font-weight:700;color:var(--on-dark-mut);letter-spacing:.04em}
.pay .c .v{font-size:78px;font-weight:800;letter-spacing:-.03em;color:var(--yellow);margin:12px 0 6px;font-variant-numeric:tabular-nums}
.pay .c .d{font-size:24px;font-weight:500;color:var(--on-dark)}
.meter{height:12px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:26px;overflow:hidden}
.meter i{display:block;height:100%;width:calc(var(--w)*1%);background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease) calc(var(--d,0)*120ms + 700ms)}
.on .meter i{transform:scaleX(1)}

/* матрица влияния */
.imx{position:absolute;left:0;top:0;width:1100px;height:540px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.imx .q{position:absolute;width:50%;height:50%;padding:20px 24px;font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mut)}
.imx .q.hot{background:rgba(255,182,0,.22)}
.imx .dot{position:absolute;white-space:nowrap;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;transform:translate(-14px,-14px)}
.imx .dot::before{content:"";width:28px;height:28px;border-radius:50%;background:var(--navy);flex:none}
.imx .dot.y::before{background:var(--yellow);box-shadow:0 0 0 4px var(--navy)}
.ax{position:absolute;font-size:19px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mut)}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.kpi .card{padding:40px 36px;min-height:500px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .big{font-size:76px}
.kpi p{font-size:24px}

.sources{columns:2;column-gap:64px;font-size:24px;line-height:1.45;font-weight:500}
.sources p{break-inside:avoid;margin-bottom:22px;color:var(--ink-mut)}
.sources b{color:var(--ink);font-weight:800;display:block;font-size:24px}


/* подложки под текстом на 3D-слайдах */
.scrim{position:absolute;pointer-events:none}
.scrim.l{inset:0;background:linear-gradient(90deg,rgba(7,10,18,.7) 0%,rgba(7,10,18,.5) 34%,rgba(7,10,18,0) 64%)}
.scrim.t{left:0;right:0;top:0;height:340px;background:linear-gradient(180deg,rgba(7,10,18,.8),rgba(7,10,18,0))}
.scrim.b{left:0;right:0;bottom:0;height:380px;background:linear-gradient(0deg,rgba(7,10,18,.78),rgba(7,10,18,0))}
.t-clear h1,.t-clear h2,.t-clear p,.t-clear .capt,.t-clear .chap,.t-clear .hint,.t-clear .hud,.t-clear .topnav{text-shadow:0 2px 20px rgba(0,0,0,.55)}

/* дерево: ствол, ветки, корни */
.tree2{position:absolute;inset:0;--wood:#9A7650;--leaf:#E5636E;--soil:rgba(255,255,255,.04);--soilline:#5A6C8E}
.tree2.g{--wood:#7A5B3A;--leaf:#2FA595;--soil:rgba(122,91,58,.09);--soilline:#B9AE98}
.tree2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tree2 .br{fill:none;stroke:var(--wood);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.05s var(--ease) calc(var(--d,0)*110ms + 800ms)}
.on .tree2 .br{stroke-dashoffset:0}
.tree2 .twig{fill:none;stroke:var(--wood);stroke-linecap:round;opacity:0;transition:opacity .5s calc(var(--d,0)*55ms + 1500ms)}
.on .tree2 .twig{opacity:1}
.tree2 .trunk{fill:var(--wood);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.02);opacity:0;transition:transform 1s var(--ease) 300ms,opacity .3s 300ms}
.on .tree2 .trunk{transform:none;opacity:1}
.tree2 .bark{fill:none;stroke:rgba(0,0,0,.28);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .5s 1.1s}
.on .tree2 .bark{opacity:1}
.tree2 .lf{fill:var(--leaf);opacity:0;transform-box:fill-box;transform-origin:center;transform:rotate(var(--r)) scale(.2);transition:opacity .5s calc(var(--d,0)*55ms + 1600ms),transform .8s var(--ease) calc(var(--d,0)*55ms + 1600ms)}
.on .tree2 .lf{opacity:.95;transform:rotate(var(--r)) scale(1)}
.tree2 .ground{stroke:var(--soilline);stroke-width:2;stroke-dasharray:10 10;fill:none}
.sign{position:absolute;left:590px;top:352px;width:500px;min-height:96px;padding:20px 28px;border-radius:18px;background:var(--yellow);color:var(--navy);font-size:33px;line-height:1.15;font-weight:800;letter-spacing:-.01em;text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.tn{position:absolute;border-radius:20px;padding:20px 26px;font-size:25px;line-height:1.3;font-weight:600;display:flex;align-items:center;border:2px solid var(--nb)}
.t-navy .tn{background:var(--navy2);--nb:rgba(255,255,255,.1)}
.t-paper .tn{background:#fff;--nb:rgba(14,23,38,.12)}

/* карта */
.mapwrap{position:absolute;left:0;top:0;width:1180px;height:1080px;overflow:hidden;background:#0b1320;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent 100%);mask-image:linear-gradient(90deg,#000 80%,transparent 100%)}
.mapin{position:absolute;inset:0;transform-origin:636px 600px}
.on .mapin{animation:kb 34s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
#mapimg{position:absolute;inset:0;width:1180px;height:1080px;filter:brightness(.46) saturate(1.25) contrast(1.12);opacity:0;transition:opacity 1.4s var(--ease) .2s}

    var E=[[10,560],[20,740],[120,400],[560,2],[770,2],[360,60],[1175,520],[1170,720],[1110,380],[520,1078],[740,1078],[920,1040],[990,130],[250,930]];

  var amb=new CarSet(AMB.length);AMB.forEach(function(a,i){tc.setHex(a.color);amb.b.setColorAt(i,tc)});
  function updAmb(mode,tau){
    AMB.forEach(function(a,i){
      var vis=false,x=0,y=0,z=0,yaw=0,pit=0,R=a.route;
      if(mode==='static'){vis=true;x=a.fin.x;y=a.fin.y;z=a.fin.z;yaw=a.fin.yaw}
      else if(a.mode===mode){
        if(mode==='intro'&&tau<a.dep){vis=true;x=-52-QS*a.q+QS*Math.min(a.q,queueShift(tau)*1)+0;
          var sh=0;intro.forEach(function(b){if(b.q<a.q)sh+=smQ((tau-b.dep)/1.5)});x=-52-QS*a.q+QS*sh;z=-3;yaw=Math.PI/2}
        else{var t=tau-(mode==='intro'?a.dep:a.t0);if(t>=0){vis=true;var o=R.at(R.sAt(t*a.ts));x=o.x;y=o.y;z=o.z;yaw=o.yaw;pit=o.pitch}}
      }
      put(amb,i,x,y,z,yaw,pit,vis?1:.0001);
    });
    amb.flush();
  }
  /* ---------- камера ---------- */
  function crArr(KT,P,t,o){
    var k=0;while(k<KT.length-2&&t>KT[k+1])k++;
    var s=clamp((t-KT[k])/(KT[k+1]-KT[k]),0,1),p0=P[Math.max(k-1,0)],p1=P[k],p2=P[k+1],p3=P[Math.min(k+2,P.length-1)];
    for(var c=0;c<3;c++)o[c]=.5*((2*p1[c])+(-p0[c]+p2[c])*s+(2*p0[c]-5*p1[c]+4*p2[c]-p3[c])*s*s+(-p0[c]+3*p1[c]-3*p2[c]+p3[c])*s*s*s);
    return o;
  }
  function l3(a,b,w){return [a[0]+(b[0]-a[0])*w,a[1]+(b[1]-a[1])*w,a[2]+(b[2]-a[2])*w]}
  function bz3(P0,P1,P2,P3,t){var u=1-t,o=[];for(var c=0;c<3;c++)o.push(u*u*u*P0[c]+3*u*u*t*P1[c]+3*u*t*t*P2[c]+t*t*t*P3[c]);return o}
  var KTI=[0,3,6,9,13],KPI=[[-300,42,-30],[-175,30,-22],[-96,30,48],[12,34,104],[62,34,104]],KLI=[[-100,0,-3],[-60,0,0],[0,6,0],[0,8,0],[0,8,0]];
  var KTo=[0,1.5,2.4],KPo=[[70,38,108],[-20,26,68],[-72,12,24]],KLo=[[0,10,0],[0,6,0],[-44,1.5,-3]];
  var FINAL_S={p:[62,34,104],t:[0,8,0],fov:36},FINAL_T={p:[-82,46,100],t:[0,8,0],fov:54};
  var ca=[0,0,0],cb=[0,0,0];
  function chase(t,P,T){
    var R=HERO.route,s=R.sAt(Math.max(0,t)*HERO.ts),back=R.at(s-8.4,{}),ah=R.at(s+6.5,{}),car=R.at(s,{}),y0=R.at(Math.max(0,s-8.4),{}).yaw,y1=R.at(s+1,{}).yaw;
    var dy=wrap(y1-y0),lat=clamp(-dy*2.6,-3.2,3.2);
    P[0]=back.x+Math.cos(car.yaw)*lat;P[1]=back.y+3.1;P[2]=back.z-Math.sin(car.yaw)*lat;
    T[0]=ah.x;T[1]=ah.y+.5;T[2]=ah.z;
    return car;
  }
  var PE0=[0,0,0],TE0=[0,0,0];chase(EX0-HERO_T0,PE0,TE0);
  var PE1=[PE0[0]+8,5.9,20],PE2=[46,26,80];
  var out={p:[0,0,0],t:[0,0,0],fov:36};
  function camera(mode,tau,time){
    var o=out,fin;
    if(mode==='intro'){
      crArr(KTI,KPI,Math.min(tau,KTI[4]),o.p);crArr(KTI,KLI,Math.min(tau,KTI[4]),o.t);o.fov=36;fin=tau>=KTI[4];
    }else if(mode==='tour'){
      var pc=[0,0,0],tcc=[0,0,0];
      if(tau<EX0){
        chase(Math.max(0,tau-HERO_T0),pc,tcc);
        if(tau<2.4){crArr(KTo,KPo,tau,o.p);crArr(KTo,KLo,tau,o.t);var w=sstep(.7,2.4,tau);o.p=l3(o.p,pc,w);o.t=l3(o.t,tcc,w);o.fov=lerp(38,52,w)}
        else{o.p=pc;o.t=tcc;o.fov=52}
      }else if(tau<EX1){var e=easeIO((tau-EX0)/(EX1-EX0));o.p=bz3(PE0,PE1,PE2,FINAL_S.p,e);o.t=bz3(TE0,[2,6,6],[0,8,0],FINAL_S.t,e);o.fov=lerp(52,36,e)}
      else{o.p=FINAL_S.p.slice();o.t=FINAL_S.t.slice();o.fov=36;fin=true}
    }else{o.p=FINAL_S.p.slice();o.t=FINAL_S.t.slice();o.fov=36;fin=true}
    if(fin){var ph=Math.sin(time*.2)*.16,cs=Math.cos(ph),sn=Math.sin(ph);var x=o.p[0]*cs+o.p[2]*sn,z=-o.p[0]*sn+o.p[2]*cs;o.p[0]=x;o.p[2]=z;o.p[1]+=Math.sin(time*.3)*1.2}
    return o;
  }
  /* ---------- состояние и кадр ---------- */
  var state={mode:'static',tau:1000,play:false,vis:false,shift:0,tshift:0,night:0,tnight:0,frame:false,dir:0};
  var hudEl=document.getElementById('hud'),hudn=document.getElementById('hudn'),scrub=document.getElementById('scrub'),tmEl=document.getElementById('tm'),ppBtn=document.getElementById('pp');
  function dur(){return state.mode==='intro'?DURI:DURT}
  var frameRect=null;
  function readFrame(){
    if(!state.frame){frameRect=null;return}
    var fe=document.querySelector('.slide.on .pframe');if(!fe){frameRect=null;return}
    var r=fe.getBoundingClientRect();frameRect={x:r.left,y:r.top,w:r.width,h:r.height};
  }
  function resize(){renderer.setSize(innerWidth,innerHeight,false)}
  addEventListener('resize',resize);resize();
  var dayFog=[.38,.40,.43],nightFog=[.075,.085,.105];
  function pose(mode,tau,time){
    var n=state.night;nightU.value=n;
    buildU.value=mode==='intro'?clamp((tau-4)/4,0,1)*1.02:(mode==='tour'?clamp((tau-.2)/2.4,0,1)*1.02:1.02);
    levels.forEach(function(L,i){L.g.position.set(0,i*H,0);L.g.rotation.y=0;L.cg.scale.y=1;L.cg.visible=true;L.g.visible=true});
    updTraffic(time,mode!=='tour'||true);
    updJam(tau,mode==='intro',time);
    updAmb(mode,tau);
    var o=camera(mode,tau,time);
    cam.position.set(o.p[0],o.p[1],o.p[2]);cam.lookAt(o.t[0],o.t[1],o.t[2]);
    if(Math.abs(cam.fov-o.fov)>.01){cam.fov=o.fov}
    scene.fog.near=lerp(170,110,n);scene.fog.far=lerp(760,520,n);
    scene.fog.color.setRGB(lerp(dayFog[0],nightFog[0],n),lerp(dayFog[1],nightFog[1],n),lerp(dayFog[2],nightFog[2],n));
    hemi.intensity=lerp(.95,.55,n);sun.intensity=lerp(.9,.32,n);
    if(mmMat)mmMat.color.setRGB(lerp(.43,.04,n),lerp(.45,.05,n),lerp(.49,.07,n));if(snowM)snowM.color.setRGB(lerp(.48,.08,n),lerp(.5,.09,n),lerp(.54,.11,n));
    /* свет внутри здания и фары героя */
    var ix=Math.max(Math.abs(o.p[0])-33,Math.abs(o.p[2])-15,0),insideF=clamp(1-ix/9,0,1)*(o.p[1]<18?1:0);
    inner.intensity=n*insideF*1.6;inner.position.set(o.p[0],o.p[1]+.5,o.p[2]);
    if(mode==='tour'&&tau>=HERO_T0&&tau<EX0+2){var hp=HERO.route.at(HERO.route.sAt((tau-HERO_T0)*HERO.ts),{});hl.intensity=n*(hp.x>-36?1.5:.7);hl.position.set(hp.x+Math.sin(hp.yaw)*3.2,hp.y+.9,hp.z+Math.cos(hp.yaw)*3.2)}else hl.intensity=0;
    /* HUD */
    if(hudEl&&mode==='tour'){var on=tau>HERO_T0+.5&&tau<EX1,lv=Math.round(HERO.route.at(HERO.route.sAt((tau-HERO_T0)*HERO.ts),{}).y/H)+1;hudEl.classList.toggle('a',on);if(on)hudn.textContent=lv}
    else if(hudEl)hudEl.classList.remove('a');
  }
  function render(time){
    readFrame();
    var W=innerWidth,Hh=innerHeight;
    pose(state.mode,state.tau,time);
    scene.background=(state.frame||FRAMEONLY)?gradTex:null;
    if(FRAMEONLY){renderer.setScissorTest(false);renderer.setViewport(0,0,W,Hh);cam.aspect=W/Hh;cam.clearViewOffset();cam.updateProjectionMatrix();renderer.render(scene,cam);return}
    if(frameRect){
      renderer.setScissorTest(false);renderer.setViewport(0,0,W,Hh);renderer.clear();
      var fx=frameRect.x,fy=Hh-frameRect.y-frameRect.h;
      renderer.setScissorTest(true);renderer.setScissor(fx,fy,frameRect.w,frameRect.h);renderer.setViewport(fx,fy,frameRect.w,frameRect.h);
      cam.aspect=frameRect.w/frameRect.h;cam.clearViewOffset();cam.updateProjectionMatrix();renderer.render(scene,cam);
    }else{
      renderer.setScissorTest(false);renderer.setViewport(0,0,W,Hh);
      cam.aspect=W/Hh;if(Math.abs(state.shift)>.002)cam.setViewOffset(W,Hh,-state.shift*W,0,W,Hh);else cam.clearViewOffset();cam.updateProjectionMatrix();renderer.render(scene,cam);
    }
  }
  var last=performance.now(),clock=0;
  function syncUI(){
    var d=dur(),u=clamp(state.tau/d,0,1);
    if(scrub&&document.activeElement!==scrub)scrub.value=Math.round(u*1000);
    if(tmEl){var s=Math.min(d,Math.round(state.tau));tmEl.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}
    if(ppBtn)ppBtn.textContent=state.play?'❚❚':'▶';
  }
  function frame(now){
    var dt=Math.min((now-last)/1000,.1);last=now;clock+=dt;
    state.shift+=(state.tshift-state.shift)*Math.min(1,dt*3.2);state.night+=(state.tnight-state.night)*Math.min(1,dt*2.5);
    if(state.play&&state.mode!=='static'){state.tau+=dt;syncUI()}
    if(state.vis)render(clock);
    if(!CAPTURE)requestAnimationFrame(frame);
  }
  if(scrub){scrub.addEventListener('input',function(){state.play=false;state.tau=scrub.value/1000*dur();syncUI()})}
  if(ppBtn){ppBtn.addEventListener('click',function(){if(state.tau>=dur()-.05)state.tau=0;state.play=!state.play;syncUI()})}
  api.setSlide=function(cfg,n,prev){
    if(!cfg){state.vis=false;canvas.classList.remove('show');return}
    var had=slides[prev]&&slides[prev].opt.gl;
    state.vis=true;canvas.classList.add('show');state.mode=cfg.mode;state.frame=!!cfg.frame;state.tshift=cfg.shift||0;state.tnight=cfg.night||0;
    if(!had){state.shift=state.tshift;state.night=state.tnight}
    if(cfg.mode==='static'){state.tau=1000;state.play=false}
    else{state.tau=0;state.play=!matchMedia('(prefers-reduced-motion:reduce)').matches;if(!state.play)state.tau=dur()}
    syncUI();
  };
  api.toggle=function(){if(state.mode!=='static'&&ppBtn)ppBtn.click()};
  api.scrubKey=function(d){
    if(!state.vis||state.mode==='static')return false;
    var D=dur(),marks=state.mode==='intro'?[D]:[T_PARK+.4,EX1+.3,D];
    if(d>0&&state.tau<D-.4){var nx=marks.find(function(m){return m>state.tau+.8});state.tau=nx===undefined?D:nx;state.play=true;syncUI();return true}
    if(d<0&&state.tau>.6&&state.mode==='tour'){var pv=[0].concat(marks).reverse().find(function(m){return m<state.tau-1.2});state.tau=pv===undefined?0:pv;state.play=true;syncUI();return true}
    return false;
  };
  api.scrubWheel=function(dy){
    if(state.mode!=='tour')return false;var D=dur();
    if(dy>0&&state.tau>=D-.05)return false;if(dy<0&&state.tau<=.05)return false;
    state.play=false;state.tau=clamp(state.tau+dy/70,0,D);syncUI();return true;
  };
  api.renderAt=function(mode,tau,time,opts){opts=opts||{};state.mode=mode;state.tau=tau;state.night=opts.night!==undefined?opts.night:state.night;state.tnight=state.night;if(opts.frame!==undefined)state.frame=opts.frame;if(opts.shift!==undefined){state.shift=opts.shift;state.tshift=opts.shift}state.vis=true;render(time===undefined?tau:time)};
  api.captureTour=function(tau){state.mode='tour';state.night=1;state.tnight=1;state.shift=0;state.vis=true;state.tau=tau;render(tau)};
  api.info=function(){return {DURT:DURT,DURI:DURI,T_PARK:T_PARK,EX0:EX0,EX1:EX1,heroT:HERO.route.T,heroL:HERO.route.L}};
  scene.traverse(function(o){o.frustumCulled=false});
  if(!CAPTURE)requestAnimationFrame(frame);
  return api;
})();

window.__GL=GL;window.__show=show;window.__N=N;

if(FRAMEONLY){document.body.classList.add('frameonly');window.__cap=function(t){GL.captureTour(t)}}
else{var h0=parseInt((location.hash||'').slice(1),10);show(isFinite(h0)&&h0>0?h0-1:0)}
})();
</script>
