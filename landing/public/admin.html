<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Заявки</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .page { max-width: 1100px; padding-top: 32px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { flex: 1 1 160px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat b { display: block; font-size: 26px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--surface-2); white-space: nowrap; font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  .actions { display: flex; gap: 10px; margin-bottom: 20px; }
  .actions a { text-decoration: none; }
  .btn--inline { width: auto; padding: 10px 18px; display: inline-block; }
  .ok { color: #57d38c; }
  .fail { color: var(--danger); }
  .muted { color: var(--muted); }
  .settings { margin-bottom: 28px; }
  .settings h2 { margin: 0 0 12px; font-size: 18px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .settings .actions { margin: 0; }
</style>
</head>
<body>
<main class="page">
  <h1>Заявки</h1>

  <section class="card settings" id="settings" hidden>
    <h2>Куда отправлять заявки</h2>
    <p class="hint" id="settingsState">Загружаем…</p>

    <div class="field">
      <label for="botToken">Токен бота Telegram</label>
      <input id="botToken" type="text" autocomplete="off" placeholder="оставьте пустым, чтобы не менять">
    </div>

    <div class="field">
      <label for="chatId">Chat id получателя</label>
      <input id="chatId" type="text" autocomplete="off" placeholder="число, у группы — с минусом">
    </div>

    <div class="field">
      <label for="sheetUrl">Адрес Google-таблицы (необязательно)</label>
      <input id="sheetUrl" type="text" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
    </div>

    <div class="actions">
      <button class="btn btn--inline" id="saveBtn" type="button">Сохранить</button>
      <button class="btn btn--inline btn--ghost" id="testBtn" type="button">Отправить пробное сообщение</button>
    </div>
    <p class="hint" id="settingsResult"></p>
  </section>
  <div id="content"><p class="lead">Загружаем…</p></div>
</main>
<script>
(function () {
  var key = new URLSearchParams(location.search).get('key') || '';
  var content = document.getElementById('content');

  // Показывает, ушла ли заявка в Telegram, и если нет — почему.
  // Заявки, принятые до появления этой отметки, показываются прочерком.
  function deliveryLabel(lead) {
    var telegram = lead.доставка && lead.доставка.telegram;
    if (!telegram) return '<span class="muted">—</span>';
    if (telegram.sent) return '<span class="ok">отправлено</span>';

    var reason = telegram.reason === 'not_configured'
      ? 'не настроен токен или chat id'
      : telegram.reason;
    if (telegram.описание) reason += ': ' + telegram.описание;
    return '<span class="fail">' + escapeHtml(reason) + '</span>';
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  var settingsBox = document.getElementById('settings');
  var settingsState = document.getElementById('settingsState');
  var settingsResult = document.getElementById('settingsResult');

  function describe(status) {
    var parts = [];
    parts.push('Токен: ' + (status.TELEGRAM_BOT_TOKEN.задано
      ? 'задан, ' + status.TELEGRAM_BOT_TOKEN.длина + ' символов (' + status.TELEGRAM_BOT_TOKEN.источник + ')'
      : 'не задан'));
    parts.push('Chat id: ' + (status.TELEGRAM_CHAT_ID.задано
      ? 'задан (' + status.TELEGRAM_CHAT_ID.источник + ')'
      : 'не задан'));
    parts.push('Таблица: ' + (status.SHEETS_WEBHOOK_URL.задано ? 'подключена' : 'не подключена'));
    return parts.join(' · ');
  }

  function loadSettings() {
    fetch('/api/settings?key=' + encodeURIComponent(key))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        settingsBox.hidden = false;
        settingsState.textContent = describe(data.settings);
      })
      .catch(function () {});
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    settingsResult.textContent = 'Сохраняем…';
    fetch('/api/settings?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        TELEGRAM_BOT_TOKEN: document.getElementById('botToken').value,
        TELEGRAM_CHAT_ID: document.getElementById('chatId').value,
        SHEETS_WEBHOOK_URL: document.getElementById('sheetUrl').value
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) { settingsResult.innerHTML = '<span class="fail">Не сохранилось: ' + escapeHtml(data.reason || data.error) + '</span>'; return; }
        settingsState.textContent = describe(data.settings);
        settingsResult.innerHTML = '<span class="ok">Сохранено</span>';
        document.getElementById('botToken').value = '';
        document.getElementById('chatId').value = '';
        document.getElementById('sheetUrl').value = '';
      })
      .catch(function () { settingsResult.innerHTML = '<span class="fail">Нет связи с сервером</span>'; });
  });

  document.getElementById('testBtn').addEventListener('click', function () {
    settingsResult.textContent = 'Отправляем…';
    fetch('/api/settings/test?key=' + encodeURIComponent(key), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var t = data.telegram || {};
        if (t.sent) { settingsResult.innerHTML = '<span class="ok">Сообщение ушло — проверьте Telegram</span>'; return; }
        var reason = t.reason === 'not_configured' ? 'токен или chat id не заданы' : t.reason;
        if (t.описание) reason += ': ' + t.описание;
        settingsResult.innerHTML = '<span class="fail">Telegram отказал — ' + escapeHtml(reason) + '</span>';
      })
      .catch(function () { settingsResult.innerHTML = '<span class="fail">Нет связи с сервером</span>'; });
  });

  loadSettings();

  fetch('/api/leads?key=' + encodeURIComponent(key))
    .then(function (response) {
      if (response.status === 401) throw new Error('Неверный ключ доступа. Добавьте ?key=... в адрес.');
      return response.json();
    })
    .then(function (data) {
      var html = '<div class="stats">' +
        '<div class="stat"><b>' + data.stats.leads + '</b><span>анкет заполнено</span></div>' +
        '</div>' +
        (data.storage.available ? '' :
          '<p class="form-error">Файловое хранилище недоступно (' + escapeHtml(data.storage.reason) +
          '). На serverless-хостинге заявки приходят только в Telegram и в логи.</p>') +
        '<div class="actions"><a class="btn btn--inline" href="/api/leads?format=csv&key=' + encodeURIComponent(key) + '">Скачать CSV</a></div>';

      if (data.leads.length === 0) {
        html += '<p class="lead">Пока ни одной анкеты.</p>';
      } else {
        html += '<div class="table-wrap"><table><thead><tr><th>Дата</th>';
        data.fields.forEach(function (field) { html += '<th>' + escapeHtml(field.label) + '</th>'; });
        html += '<th>Telegram</th></tr></thead><tbody>';
        data.leads.forEach(function (lead) {
          html += '<tr><td>' + new Date(lead.createdAt).toLocaleString('ru-RU') + '</td>';
          data.fields.forEach(function (field) {
            html += '<td>' + escapeHtml(lead.answers[field.name] || '') + '</td>';
          });
          html += '<td>' + deliveryLabel(lead) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      content.innerHTML = html;
    })
    .catch(function (error) {
      content.innerHTML = '<p class="form-error">' + escapeHtml(error.message) + '</p>';
    });
})();
</script>
</body>
</html>
