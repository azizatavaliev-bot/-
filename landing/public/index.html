<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NEW G — таргетолог нового поколения</title>
<meta name="description" content="Курс, где ты осваиваешь профессию таргетолога и учишься работать с искусственным интеллектом как со своим личным ассистентом.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="timer" id="timer" hidden>
  <span class="timer__label">Доступ к уроку</span>
  <span class="timer__value" id="timerValue">--:--:--</span>
</div>

<main>
  <!-- Экран 1.5: бесплатный видеоурок -->
  <section class="section lesson" id="lesson">
    <div class="lesson__box" id="lessonBox">
      <!-- Урок раздаёт YouTube: он подбирает качество под скорость сети и даёт
           родной полный экран на телефоне. Чтобы поменять ролик, достаточно
           заменить идентификатор в конце адреса. -->
      <iframe
        class="lesson__frame"
        src="https://www.youtube.com/embed/Pu6MlGW90aM?rel=0&amp;modestbranding=1&amp;playsinline=1"
        title="Видеоурок"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen
        loading="lazy"></iframe>
    </div>
  </section>

  <!-- Экран 4: оффер и анкета -->
  <section class="section" id="form">
    <div class="card" id="formCard" hidden>
      <form id="anketa" novalidate>
        <div id="fields"></div>
        <p class="form-error" id="formError" hidden></p>
        <button type="submit" class="btn" id="submitBtn">Отправить</button>
        <p class="note">Анкету можно отправить один раз и только пока идёт таймер.</p>
      </form>
    </div>

    <div class="card card--state" id="stateCard" hidden>
      <h3 id="stateTitle"></h3>
      <p id="stateText"></p>
    </div>

    <div class="card card--state" id="loadingCard"><p>Загружаем анкету…</p></div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
