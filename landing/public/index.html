<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NEW G — таргетолог нового поколения</title>
<meta name="description" content="Курс, где ты осваиваешь профессию таргетолога и учишься работать с искусственным интеллектом как со своим личным ассистентом.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<main>
  <!-- Экран 1.5: бесплатный видеоурок -->
  <section class="section lesson" id="lesson">
    <div class="lesson__box" id="lessonBox">
      <!-- Урок раздаёт YouTube: он подбирает качество под скорость сети и даёт
           родной полный экран на телефоне. Чтобы поменять ролик, достаточно
           заменить идентификатор в конце адреса. -->
      <iframe
        class="lesson__frame"
        src="https://www.youtube.com/embed/Pu6MlGW90aM?rel=0&amp;modestbranding=1&amp;playsinline=1"
        title="Видеоурок"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen
        loading="lazy"></iframe>
    </div>
  </section>

  <!-- Экран 4: оффер и анкета -->
  <section class="section" id="form">
    <div class="card" id="formCard">
      <form id="anketa" novalidate>
        <div id="fields">
          <div class="field" data-name="name"><label for="f_name">Как тебя зовут<span class="req"> *</span></label><input id="f_name" name="name" type="text" maxlength="80"></div>
          <div class="field" data-name="phone"><label for="f_phone">WhatsApp для связи<span class="req"> *</span></label><input id="f_phone" name="phone" type="tel" inputmode="tel" maxlength="30" placeholder="+996 700 000 000"></div>
          <div class="field" data-name="age"><label for="f_age">Сколько тебе лет<span class="req"> *</span></label><input id="f_age" name="age" type="number" inputmode="numeric"></div>
          <div class="field" data-name="city"><label for="f_city">Город</label><input id="f_city" name="city" type="text" maxlength="80"></div>
        </div>
        <p class="form-error" id="formError" hidden></p>
        <button type="submit" class="btn" id="submitBtn">Записаться на консультацию</button>
      </form>
    </div>

    <div class="card card--state" id="stateCard" hidden>
      <h3>Анкета принята</h3>
      <p>Свяжемся с тобой по указанному WhatsApp и согласуем время консультации.</p>
    </div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
