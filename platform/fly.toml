# fly launch --no-deploy --copy-config && fly volumes create adops_data --size 1 && fly secrets set ... && fly deploy
app = "adops-platform"
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "3000"

[mounts]
  source = "adops_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # бот и синхронизация должны работать постоянно
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
